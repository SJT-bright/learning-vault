<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true"><svg class="ic ic-brand"><use href="#i-vault"/></svg></span>
      <span class="brand-name">图片收藏夹</span>
    </div>
    <nav id="view-nav">
      <button class="nav-item active" data-view="gallery" title="图片收藏">
        <svg class="ic" aria-hidden="true"><use href="#i-gallery"/></svg><span class="nav-label">图片收藏</span>
      </button>
      <button class="nav-item" data-view="prompts" title="提示词库">
        <svg class="ic" aria-hidden="true"><use href="#i-prompts"/></svg><span class="nav-label">提示词库</span>
      </button>
    </nav>
    <div class="side-section">
      <div class="side-head">
        <span class="side-title">分类</span>
        <button id="btn-add-category" class="side-add" title="新建分类">
          <svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg>
        </button>
      </div>
      <ul id="cat-list">
        <li class="cat-item active" data-cat="" data-builtin="true">
          <span class="cat-dot"><svg class="ic" aria-hidden="true"><use href="#i-gallery"/></svg></span>
          <span class="cat-name">全部图片</span><span class="cat-count" id="count-all">0</span><button class="cat-edit" title="更换图标"><svg class="ic ic-xs" aria-hidden="true"><use href="#i-cat-pencil"/></svg></button>
        </li>
        <li class="cat-item" data-cat="__uncat" data-builtin="true">
          <span class="cat-dot"><svg class="ic" aria-hidden="true"><use href="#i-inbox"/></svg></span>
          <span class="cat-name">待收录</span><span class="cat-count" id="count-uncat">0</span><button class="cat-edit" title="更换图标"><svg class="ic ic-xs" aria-hidden="true"><use href="#i-cat-pencil"/></svg></button>
        </li>
        <li class="cat-item" data-cat="__fav" data-builtin="true">
          <span class="cat-dot"><svg class="ic" aria-hidden="true"><use href="#i-star-fill"/></svg></span>
          <span class="cat-name">星标收藏</span><span class="cat-count" id="count-fav">0</span><button class="cat-edit" title="更换图标"><svg class="ic ic-xs" aria-hidden="true"><use href="#i-cat-pencil"/></svg></button>
        </li>
        <li class="cat-item" data-cat="__trash" data-builtin="true">
          <span class="cat-dot"><svg class="ic" aria-hidden="true"><use href="#i-trash"/></svg></span>
          <span class="cat-name">回收站</span><span class="cat-count" id="count-trash">0</span><button class="cat-edit" title="更换图标"><svg class="ic ic-xs" aria-hidden="true"><use href="#i-cat-pencil"/></svg></button>
        </li>
      </ul>
    </div>
    <div class="side-footer">
      <div class="backup-row">
        <button id="btn-backup-export" class="stats-action" title="把全部图片和提示词打包成 JSON 文件保存到本地">导出备份</button>
        <button id="btn-backup-import" class="stats-action" title="从备份 JSON 文件恢复图片">导入备份</button>
      </div>
      <input type="file" id="file-import" accept=".json,application/json" hidden>
      <div id="stats" class="stats">共 0 张 · 0 KB</div>
      <button id="btn-refetch-all" class="stats-action" hidden title="尝试把所有外链图片抓取到本地">补抓外链</button>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <div class="search-wrap">
        <svg class="ic ic-search" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="search" type="search" placeholder="搜索名称或提示词…" aria-label="搜索名称或提示词">
      </div>
      <select id="sort-select" class="topbar-select" aria-label="排序方式">
        <option value="new">最新优先</option>
        <option value="old">最早优先</option>
        <option value="name">名称 A-Z</option>
      </select>
      <button id="btn-import" class="btn-primary">
        <svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg><span>收藏图片</span>
      </button>
      <input id="file-input" type="file" accept="image/*" multiple hidden>
    </header>

    <section id="view-gallery" class="view active">
      <div id="grid" class="grid"></div>
      <div id="empty-state" class="empty-state" hidden>
        <div class="empty-icon" aria-hidden="true"><svg class="ic ic-xl"><use href="#i-folder-open"/></svg></div>
        <div class="empty-title">收藏夹还是空的</div>
        <div class="empty-desc">把图片拖进这个窗口，或按 Ctrl+V 粘贴截图，<br>点右上角「收藏图片」也可以。图片会永久保存在本地浏览器里。</div>
      </div>
    </section>

    <section id="view-prompts" class="view">
      <div id="prompt-list" class="prompt-list"></div>
      <div id="prompt-empty" class="empty-state" hidden>
        <div class="empty-icon" aria-hidden="true"><svg class="ic ic-xl"><use href="#i-note"/></svg></div>
        <div class="empty-title">还没有收藏任何提示词</div>
        <div class="empty-desc">打开任意图片的详情，展开「提示词」抽屉写入提示词，<br>保存后它就会出现在这里。</div>
      </div>
    </section>
  </main>
</div>

<!-- 拖放遮罩 -->
<div id="drop-overlay" hidden>
  <div class="drop-inner">
    <div class="drop-icon" aria-hidden="true"><svg class="ic ic-xl"><use href="#i-tray-down"/></svg></div>
    <div class="drop-title">松手收藏</div>
    <div class="drop-desc">支持多张图片 · 拖进来就变成你的永久资产</div>
  </div>
</div>

<!-- 灯箱详情 -->
<div id="lightbox" hidden>
  <div class="lb-backdrop"></div>
  <div class="lb-body">
    <div class="lb-stage">
      <button id="lb-prev" class="lb-nav" title="上一张" aria-label="上一张">
        <svg class="ic" aria-hidden="true"><use href="#i-chevron-left"/></svg>
      </button>
      <img id="lb-img" src="" alt="预览">
      <button id="lb-next" class="lb-nav" title="下一张" aria-label="下一张">
        <svg class="ic" aria-hidden="true"><use href="#i-chevron-right"/></svg>
      </button>
    </div>
    <aside class="lb-info">
      <div class="lb-info-head">
        <input id="lb-name" class="lb-name" type="text" value="" aria-label="图片名称">
        <button id="lb-close" class="lb-close" title="关闭" aria-label="关闭">
          <svg class="ic" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>
      <div id="lb-meta" class="lb-meta">—</div>
      <div class="lb-row">
        <label class="lb-label" for="lb-cat-select">分类</label>
        <select id="lb-cat-select"></select>
      </div>
      <div class="lb-actions">
        <button id="lb-fav" class="btn-ghost" title="星标">
          <svg class="ic" aria-hidden="true"><use id="lb-fav-use" href="#i-star"/></svg><span id="lb-fav-text">星标</span>
        </button>
        <button id="lb-download" class="btn-ghost" title="下载原图">
          <svg class="ic" aria-hidden="true"><use href="#i-download"/></svg><span>下载原图</span>
        </button>
        <button id="lb-refetch" class="btn-ghost" title="尝试抓取原图存到本地" hidden>
          <svg class="ic" aria-hidden="true"><use href="#i-tray-down"/></svg><span>补抓原图</span>
        </button>
        <button id="lb-delete" class="btn-danger" title="删除">
          <svg class="ic" aria-hidden="true"><use href="#i-trash"/></svg><span>删除</span>
        </button>
      </div>
      <div id="prompt-drawer" class="prompt-drawer">
        <button id="prompt-toggle" class="prompt-toggle">
          <span class="prompt-toggle-label">提示词</span>
          <span id="prompt-save-state" class="prompt-save-state"></span>
          <span class="prompt-chev" aria-hidden="true"><svg class="ic ic-sm"><use href="#i-chevron-down"/></svg></span>
        </button>
        <div class="prompt-drawer-body">
          <textarea id="prompt-text" placeholder="写下生成这张图的提示词…（自动保存）" aria-label="提示词"></textarea>
          <div class="prompt-drawer-foot">
            <span class="prompt-hint">会保存在这张图片上，并同步到提示词库</span>
            <button id="btn-copy-prompt" class="btn-ghost btn-small">
              <svg class="ic ic-sm" aria-hidden="true"><use href="#i-copy"/></svg><span>复制</span>
            </button>
          </div>
        </div>
      </div>
    </aside>
  </div>
</div>

<div id="toast-zone"></div>

<!-- ============ 分类弹窗：名称 + 图标选择 ============ -->
<div id="cat-modal" hidden>
  <div class="cm-backdrop" data-cm-close="1"></div>
  <div class="cm-panel" role="dialog" aria-modal="true" aria-labelledby="cm-title">
    <div class="cm-head">
      <span class="cm-title" id="cm-title">新建分类</span>
      <button id="cm-close" class="cm-x" type="button" title="关闭" aria-label="关闭">
        <svg class="ic ic-sm" aria-hidden="true"><use href="#i-close"/></svg>
      </button>
    </div>
    <label class="cm-label" for="cm-name">名称</label>
    <input id="cm-name" class="cm-input" type="text" maxlength="24" autocomplete="off"
           placeholder="例如：灵感参考" aria-label="分类名称">
    <div class="cm-label cm-label-row">
      <span>图标</span>
      <span id="cm-icon-preview" class="cm-icon-preview" aria-hidden="true"></span>
    </div>
    <div id="cm-icons" class="cm-icons" role="radiogroup" aria-label="选择图标"></div>
    <div class="cm-img-row">
      <button id="cm-img-set" class="btn-ghost" type="button" title="用一张本地图片作为这个分类的图标">用图片当图标</button>
      <button id="cm-img-clear" class="btn-ghost" type="button" hidden title="清除图片图标，恢复线条图标">恢复线条图标</button>
    </div>
    <input type="file" id="cm-img-file" accept="image/*" hidden>
    <div class="cm-foot">
      <button id="cm-cancel" class="btn-ghost" type="button">取消</button>
      <button id="cm-ok" class="btn-primary" type="button"><span id="cm-ok-text">创建</span></button>
    </div>
  </div>
</div>

<script>
  // 每次窗口重新显示时重放整窗虚化渐入（与主进程 iv:shown 联动）
  try {
    if (window.vault && window.vault.onIvShown) window.vault.onIvShown(() => {
      document.body.classList.remove('win-in'); void document.body.offsetWidth; document.body.classList.add('win-in');
    });
  } catch {}
</script>
