<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>学习资产库</title>
<style>
  /* ============================================================
     学习资产库 · 深色 3D 立体版
     设计方向：冷灰深色基底 + 祖母绿主色 + 铜橙锐利点缀；
     3D 语言 = 多层投影(近实远虚) + 顶部内侧高光 + 立体斜面渐变 +
     轻微 3D 变换；页面切换 = 虚化(blur)+透明度+景深scale 渐入。
     ============================================================ */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "PingFang SC", sans-serif;
    color: #e9ece8;
    /* 真实图片背景：雾山森林（assets/bg-forest.jpg），上暗化压层级 */
    background: url('../assets/bg-forest.jpg') center / cover no-repeat fixed, #101413;
    background-attachment: fixed;
  }
  /* 图片上的暗化遮罩：保证文字对比度 */
  .bg::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background:
      linear-gradient(180deg, rgba(10,14,12,.52) 0%, rgba(10,14,12,.38) 45%, rgba(10,14,12,.55) 100%);
  }
  :root {
    --green: #43a06e; --green-deep: #274a37; --green-dim: #2e6a4c;
    --copper: #d98e4f;
    --ink: #f0f3f0; --ink-2: #c0c8c1; --ink-3: #89948b;
    --hairline: rgba(233,236,232,.09);
    --panel: #1d221f;
    /* 3D 投影层级：近层实、远层虚，阴影统一带绿色调 */
    --sh-1: 0 1px 0 rgba(255,255,255,.06) inset, 0 1px 2px rgba(0,0,0,.5);
    --sh-2: 0 1px 0 rgba(255,255,255,.07) inset, 0 10px 24px -8px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4);
    --sh-3: 0 1px 0 rgba(255,255,255,.08) inset, 0 24px 50px -12px rgba(0,0,0,.6), 0 8px 18px -6px rgba(0,0,0,.45);
    --ease: cubic-bezier(.22,1,.36,1);
  }
  /* ---------- 桌面背景氛围层 ---------- */
  .bg { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .bg .orb { position: absolute; border-radius: 50%; filter: blur(70px); }
  .orb.o1 { width: 420px; height: 420px; right: -80px; top: -120px; background: rgba(67,160,110,.06); }
  .orb.o2 { width: 300px; height: 300px; left: 6%; bottom: -100px; background: rgba(196,116,63,.04); }

  body { display: flex; }

  /* ---------- 侧栏：实体面板（斜面 + 内高光 + 投影） ---------- */
  .side {
    width: 232px; flex: none; display: flex; flex-direction: column; gap: 4px;
    padding: 16px 12px 12px; overflow: auto;
    /* 高透明玻璃面板：轻磨砂浮在背景图上 */
    background: rgba(16, 22, 19, 0.30);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
    backdrop-filter: blur(18px) saturate(1.4);
    border-right: 1px solid rgba(255,255,255,.10);
    box-shadow: 8px 0 32px -18px rgba(0,0,0,.5);
    position: relative; z-index: 2;
  }
  .logo { font-size: 15.5px; font-weight: 800; letter-spacing: .02em; padding: 2px 8px 12px; display: flex; align-items: center; gap: 10px; color: #f2f5f1; }
  .logo img { width: 26px; height: 26px; border-radius: 7px; box-shadow: 0 3px 9px -2px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.1); }
  .logo .cube {
    width: 22px; height: 22px; border-radius: 6px; position: relative; flex: none;
    background: linear-gradient(145deg, #4fb47d, #2e6a4c 58%, #1e4432);
    box-shadow: 0 4px 10px -2px rgba(46,106,76,.55), inset 0 1px 0 rgba(255,255,255,.35);
    transform: rotate(-6deg);
  }
  .logo .cube::after {
    content: ""; position: absolute; inset: 0; border-radius: 6px;
    background: linear-gradient(200deg, rgba(255,255,255,.28), transparent 42%);
  }
  .side .search {
    width: 100%; padding: 9px 12px; font-size: 12.5px; color: var(--ink); outline: none;
    background: rgba(12, 18, 15, 0.42);
    border: 1px solid rgba(255,255,255,.12); border-bottom-color: rgba(0,0,0,.4);
    border-radius: 10px; box-shadow: var(--sh-1); margin-bottom: 8px;
    transition: border-color .2s, box-shadow .2s;
  }
  .side .search::placeholder { color: var(--ink-3); }
  .side .search:focus { border-color: rgba(67,160,110,.55); box-shadow: 0 0 0 3px rgba(67,160,110,.15), var(--sh-1); }
  .navsec { font-size: 10.5px; color: var(--ink-3); letter-spacing: .22em; padding: 14px 8px 6px; }
  .nav {
    padding: 8px 11px; border-radius: 10px; font-size: 13px; color: var(--ink-2); cursor: pointer;
    display: flex; justify-content: space-between; align-items: center; user-select: none;
    border: 1px solid transparent; position: relative;
    transition: transform .18s var(--ease), background .18s, border-color .18s, box-shadow .18s, color .18s;
    transform-style: preserve-3d;
  }
  .nav { 
    will-change: transform;
  }
  .nav:hover { color: var(--ink); transform: translateX(3px) translateY(-1px); }
  /* 3D 凸起态：半透明祖母绿玻璃 + 底部深边 + 悬浮投影 */
  .nav.active {
    color: #f2f5f1; font-weight: 600;
    background: rgba(67, 160, 110, 0.30);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-color: rgba(255,255,255,.18); border-bottom-color: rgba(0,0,0,.35);
    box-shadow: 0 1px 0 rgba(255,255,255,.16) inset, 0 6px 14px -4px rgba(0,0,0,.4);
  }
  .nav:active { transform: translateY(1px); box-shadow: var(--sh-1); }
  .nav .n { font-size: 10.5px; padding: 1px 7px; border-radius: 99px; color: var(--ink-3);
    background: rgba(0,0,0,.3); box-shadow: inset 0 1px 2px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.05); }
  .nav.active .n { color: #dff0e6; background: rgba(0,0,0,.28); }
  /* 侧栏计数控件数字变化时的轻微弹跳（JS 侧 bumpBadge 加/摘 .bump 类） */
  .nav .n.bump { animation: badgeBump .3s cubic-bezier(.22,1,.36,1); }
  @keyframes badgeBump { 0%{transform:scale(1)} 40%{transform:scale(1.35)} 100%{transform:scale(1)} }
  .sidebtns { margin-top: auto; display: flex; flex-direction: column; gap: 7px; padding-top: 14px; }
  .sidebtn {
    border: 1px solid rgba(255,255,255,.12); border-bottom-color: rgba(0,0,0,.4); border-radius: 10px;
    padding: 8px 11px; font-size: 12px; cursor: pointer; text-align: left; color: var(--ink-2);
    background: rgba(255, 255, 255, 0.08);
    box-shadow: var(--sh-1);
    transition: transform .12s var(--ease), box-shadow .12s, color .12s, border-color .12s, background .12s;
  }
  .sidebtn:hover { color: #ffffff; border-color: rgba(255,255,255,.28); background: rgba(255,255,255,.14); transform: translateY(-1.5px) scale(1.015); box-shadow: var(--sh-2); }
  .sidebtn:active { transform: translateY(0.5px); box-shadow: var(--sh-1); }

  /* ---------- 主区 ---------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; z-index: 1; }
  .topbar {
    flex: none; display: flex; align-items: center; gap: 10px; padding: 13px 20px;
    border-bottom: 1px solid rgba(255,255,255,.08);
    background: rgba(14, 20, 17, 0.28);
    -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4);
  }
  .topbar h2 { flex:none; white-space:nowrap; font-size: 15px; font-weight: 700; color: #f2f5f1; }
  .topbar .spacer { flex: 1; }
  .topbar{flex-wrap:wrap}.kindbar{flex-wrap:wrap}
  select.sortsel, select.tagfilter {
    border: 1px solid rgba(255,255,255,.14); border-bottom-color: rgba(0,0,0,.4); border-radius: 9px;
    padding: 6px 9px; font-size: 12px; color: var(--ink-2); outline: none;
    background: rgba(12, 18, 15, 0.38);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    box-shadow: var(--sh-1);
  }
  .btn3d {
    border: 1px solid rgba(255,255,255,.2); border-bottom-color: rgba(0,0,0,.4); border-radius: 10px;
    padding: 8px 16px; font-size: 12.5px; font-weight: 700; cursor: pointer; color: #f2faf5;
    background: rgba(67, 160, 110, 0.48);
    box-shadow: 0 1px 0 rgba(255,255,255,.22) inset, 0 8px 18px -6px rgba(30,80,52,.55), 0 2px 5px rgba(0,0,0,.3);
    transition: transform .12s var(--ease), box-shadow .12s, background .12s;
    transform-style: preserve-3d;
  }
  .btn3d:hover { transform: translateY(-2px) scale(1.03); background: rgba(67,160,110,.6); box-shadow: 0 1px 0 rgba(255,255,255,.24) inset, 0 12px 24px -6px rgba(30,80,52,.6), 0 3px 8px rgba(0,0,0,.35); }
  .btn3d:active { transform: translateY(1px); box-shadow: 0 1px 0 rgba(255,255,255,.18) inset, 0 2px 5px rgba(0,0,0,.35); }
  .btn-ghost {
    border: 1px solid rgba(255,255,255,.14); border-bottom-color: rgba(0,0,0,.4); border-radius: 10px;
    padding: 8px 14px; font-size: 12.5px; cursor: pointer; color: var(--ink-2);
    background: rgba(255, 255, 255, 0.08);
    box-shadow: var(--sh-1);
    transition: transform .12s var(--ease), box-shadow .12s, color .12s, background .12s;
  }
  .btn-ghost:hover { color: #fff; transform: translateY(-1.5px) scale(1.02); background: rgba(255,255,255,.14); box-shadow: var(--sh-2); }
  .btn-ghost:active { transform: translateY(0.5px); box-shadow: var(--sh-1); }

  /* ---------- 内容区：列表 + 详情 ---------- */
  .content { flex: 1; display: flex; min-height: 0; }
  .list { width: 372px; flex: none; border-right: 1px solid rgba(255,255,255,.07); overflow: auto; padding: 12px;
    background: rgba(10, 15, 13, 0.22);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  /* 资料卡：高透明玻璃片，hover 抬起 + 微 3D 倾斜 */
  .card {
    background: rgba(255, 255, 255, 0.075);
    border: 1px solid rgba(255,255,255,.11); border-bottom-color: rgba(0,0,0,.3);
    border-radius: 12px; padding: 12px 13px; margin-bottom: 9px; cursor: pointer;
    box-shadow: var(--sh-1);
    transition: transform .16s var(--ease), box-shadow .16s, border-color .16s, background .16s;
    transform-style: preserve-3d;
  }
  /* ============================================================
     全局动效系统
     1) 模块 hover：浮起（抬升+景深+投影变深），滑走落下，按下回落
     2) 视图切换：屏幕虚化 → 瞬间聚焦（fxIn/fxOut）
     ============================================================ */
  .card:hover {
    transform: translateY(-4px) perspective(700px) rotateX(2deg) scale(1.012);
    box-shadow: var(--sh-3); border-color: rgba(255,255,255,.3); background: rgba(255,255,255,.12);
  }
  .card:active { transform: translateY(0) scale(.995); box-shadow: var(--sh-1); transition-duration: .06s; }
  .card.active {
    border-color: rgba(103,194,143,.55);
    background: rgba(67, 160, 110, 0.17);
    box-shadow: var(--sh-2), 0 0 0 1px rgba(103,194,143,.25);
  }
  .card .t { font-size: 13.5px; font-weight: 650; color: #f7f9f6; line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .s { font-size: 12px; color: rgba(240,243,240,.78); margin-top: 5px; line-height: 1.6;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .meta { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .badge {
    font-size: 10.5px; padding: 2.5px 8px; border-radius: 99px; font-weight: 650; color: #c8ecd7;
    background: rgba(67, 160, 110, 0.3);
    border: 1px solid rgba(255,255,255,.14); border-bottom-color: rgba(0,0,0,.3);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.14);
  }
  .badge.gray { color: rgba(240,243,240,.85); background: rgba(255,255,255,.1); }
  .badge.clickable { cursor: pointer; transition: transform .14s var(--ease), background .14s, border-color .14s; }
  .badge.clickable:hover { transform: translateY(-1.5px) scale(1.06); background: rgba(255,255,255,.2); border-color: rgba(255,255,255,.35); }
  .badge.clickable:active { transform: translateY(0.5px); transition-duration: .05s; }
  .badge.blue { color: #c4d9f2; background: rgba(90, 130, 190, 0.32); }
  .badge.burl { color: #bfe0f5; background: rgba(90, 140, 190, 0.3); }
  .badge.bfile { color: #dcc8f2; background: rgba(130, 100, 190, 0.3); }
  .badge.bchat { color: #ecd9c4; background: rgba(190, 130, 75, 0.32); }
  .badge.bnote { color: #d6e3c8; background: rgba(120, 150, 80, 0.3); }
  .badge.bvideo { color: #f2cdd8; background: rgba(190, 85, 120, 0.3); }
  .badge.blark { color: #cfe0f7; background: rgba(55, 96, 180, 0.42); }
  .badge.resurface-reason { color: #f2e3c4; background: rgba(190, 145, 75, 0.28); }
  .rs-acts { display: inline-flex; gap: 6px; margin-left: auto; }
  .rs-act {
    font-size: 10.5px; padding: 2.5px 9px; border-radius: 99px; cursor: pointer;
    color: var(--ink-2); background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.13);
    transition: background .14s, color .14s, transform .14s;
  }
  .rs-act:hover { color: #fff; background: rgba(255,255,255,.16); transform: translateY(-1px); }
  .rs-act:active { transform: translateY(0.5px); }

  /* 树形分类导航：层级缩进 + 折叠箭头 + 子类父路径提示 */
  .cat-arrow { display: inline-flex; align-items: center; justify-content: center; flex: none;
    width: 14px; height: 14px; margin-right: 4px; font-size: 9px; color: var(--ink-3);
    cursor: pointer; border-radius: 4px; transition: background .12s, color .12s; }
  .cat-arrow:hover { color: #d7f2e8; background: rgba(255,255,255,.12); }
  .cat-arrow.none { cursor: default; }
  .cat-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-path { font-size: 9.5px; color: var(--ink-3); margin-left: 5px; font-weight: 400; }

  /* 详情页聊天流：说话人/时间/正文/附件，按时序上下排列 */
  .chatflow { margin: 8px 0 4px; border-left: 2px solid rgba(103,180,142,.35); padding-left: 14px; display: flex; flex-direction: column; gap: 10px; }
  .cf-msg { background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.09); }
  .cf-msg.hl { outline: 2px solid rgba(217,142,79,.75); background: rgba(217,142,79,.12); }
  .ex-row, .use-row { font-size: 12.5px; line-height: 1.65; padding: 8px 10px; border-radius: 10px;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); margin: 6px 0; }
  .ex-ai { font-size: 10px; color: #9bb7d4; margin-left: 6px; }
  .pending { color: #e0b07a; font-size: 12px; }
    border-radius: 10px; padding: 8px 12px 9px; }
  .cf-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .cf-speaker { font-size: 12.5px; font-weight: 700; color: #bfe8d2; }
  .cf-time { font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .cf-text { font-size: 13px; color: rgba(240,243,240,.92); line-height: 1.75; white-space: pre-wrap; word-break: break-word; }
  .cf-att { display: inline-flex; align-items: center; gap: 5px; margin-top: 6px; font-size: 11px; color: #9fd8ba;
    background: rgba(103,180,142,.14); border: 1px solid rgba(103,180,142,.35); border-radius: 99px; padding: 2.5px 10px; cursor: pointer; }
  .cf-att:hover { background: rgba(103,180,142,.26); color: #dff0e6; }
  .badge.bimg { color: #c8ece4; background: rgba(58, 148, 130, 0.35); }

  /* ---- 图片资产 / 文档图片画廊（v0.5.2） ---- */
  .card { position: relative; }
  .card .cthumb { position: absolute; right: 12px; top: 12px; width: 56px; height: 42px; object-fit: cover;
    border-radius: 6px; border: 1px solid rgba(255,255,255,.16); box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .imgview { margin: 12px 0; border: 1px solid rgba(255,255,255,.12); border-radius: 12px; overflow: hidden;
    max-height: 380px; display: flex; justify-content: center; background: rgba(0,0,0,.25); }
  .imgview img { max-width: 100%; max-height: 380px; object-fit: contain; display: block; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 8px 0 4px; }
  .gitem { border: 1px solid rgba(255,255,255,.1); border-radius: 10px; overflow: hidden; background: rgba(255,255,255,.04); }
  .gitem img { width: 100%; height: 96px; object-fit: cover; display: block; cursor: zoom-in; }
  .gitem .gbar { display: flex; gap: 9px; padding: 5px 8px; border-top: 1px solid rgba(255,255,255,.08); }
  .gact { font-size: 10.5px; color: #9fc7b8; cursor: pointer; white-space: nowrap; }
  .gact:hover { color: #d7f2e8; text-decoration: underline; }
  .doclinks { margin: 6px 0 10px; display: flex; flex-direction: column; gap: 4px; }
  .lrow { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
  .lrow a { color: #a9cde0; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .lrow a:hover { text-decoration: underline; }
  #lightbox { position: fixed; inset: 0; z-index: 999; display: none; align-items: center; justify-content: center; background: rgba(5,10,8,.88); }
  #lightbox.show { display: flex; }
  #lightbox img { max-width: 92vw; max-height: 88vh; border-radius: 8px; box-shadow: 0 20px 80px rgba(0,0,0,.6); transition: transform .12s ease-out; will-change: transform; }
  #lightbox .lb-x { position: absolute; right: 22px; top: 16px; font-size: 22px; color: #cfe3da; cursor: pointer; }
  #lightbox .lb-nav span { position: absolute; top: 50%; transform: translateY(-50%); font-size: 34px; color: #cfe3da; cursor: pointer; user-select: none; padding: 10px; }
  #lightbox #lbPrev { left: 16px; }
  #lightbox #lbNext { right: 16px; }

  /* 正文富渲染：图片按 Word 原位穿插在段落之间 */
  .dtext .bpara { margin: 0 0 10px; white-space: pre-wrap; }
  .bfig { margin: 14px 0; }
  .bfig img { max-width: 100%; max-height: 340px; border-radius: 10px; border: 1px solid rgba(255,255,255,.12);
    cursor: zoom-in; display: block; margin: 0 auto; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
  .bfig img:hover { border-color: rgba(255,255,255,.3); }
  .kindbar { display: flex; gap: 5px; align-items: center; }
  .kchip {
    font-size: 11px; padding: 4.5px 11px; border-radius: 99px; cursor: pointer; color: rgba(233,236,232,.6); user-select: none;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255,255,255,.11); border-bottom-color: rgba(0,0,0,.35); box-shadow: var(--sh-1);
    transition: transform .12s var(--ease), color .12s, background .12s, border-color .12s;
  }
  .kchip:hover { color: var(--ink-2); transform: translateY(-1.5px) scale(1.04); background: rgba(255,255,255,.14); }
  .kchip:active, .sidebtn:active, .btn-ghost:active { transform: translateY(0.5px); }
  .kchip.active {
    color: #f2faf5; font-weight: 650;
    background: rgba(67, 160, 110, 0.45);
    border-color: rgba(255,255,255,.2); border-bottom-color: rgba(0,0,0,.3);
    box-shadow: 0 1px 0 rgba(255,255,255,.18) inset, 0 5px 12px -4px rgba(0,0,0,.4);
  }
  .time { font-size: 10.5px; color: var(--ink-3); margin-left: auto; }
  .list-empty { text-align: center; color: var(--ink-3); font-size: 13px; margin-top: 70px; line-height: 2.1; }
  .empty-cta { display: inline-block; margin-top: 6px; padding: 8px 22px; border-radius: 10px; cursor: pointer;
    font-size: 13px; font-weight: 700; color: #f2faf5; background: linear-gradient(145deg, #3aa876, #237a53 70%);
    border: 1px solid rgba(255,255,255,.25); box-shadow: 0 8px 18px -6px rgba(35,122,83,.55); transition: transform .14s var(--ease); }
  .empty-cta:hover { transform: translateY(-2px); }
  .empty-action { display: inline-block; margin-top: 10px; padding: 6px 18px; border-radius: 99px; cursor: pointer; font-size: 12.5px;
    color: #c8ecd7; background: rgba(67,160,110,.25); border: 1px solid rgba(103,194,143,.35);
    transition: transform .14s var(--ease), background .14s; }
  .empty-action:hover { transform: translateY(-1.5px); background: rgba(67,160,110,.4); }
  .empty-action:active { transform: translateY(0.5px); }

  .detail { flex: 1; overflow: auto; padding: 20px 24px 40px; min-width: 0; }
  .detail .empty { color: var(--ink-3); font-size: 13px; margin-top: 44px; text-align: center; }
  .empty-art { width: 128px; height: 128px; margin: 0 auto 14px; display: block;
    filter: drop-shadow(0 18px 30px rgba(0,0,0,.5)); animation: floaty 4.5s ease-in-out infinite; }

  /* ============================================================
     页面切换特效：虚化(blur) + 透明度 + 景深缩放 渐入
     用法：给进入的容器加 .fx-in；配合 .fx-out 退场。
     ============================================================ */
  /* ---- 屏幕级虚化聚焦转场（每次切换视图/分类/筛选时整屏虚化→瞬间进入） ---- */
  @keyframes screenIn {
    0%   { opacity: 0; filter: blur(18px) saturate(1.4); transform: perspective(1100px) translateZ(-70px) scale(1.06); }
    55%  { opacity: 1; }
    100% { opacity: 1; filter: blur(0) saturate(1); transform: perspective(1100px) translateZ(0) scale(1); }
  }
  /* 方向感视图切换：侧栏有序视图切换时，内容从目标方向浅入（叠加在 blur 渐入上） */
  @keyframes screenInR {
    0%   { opacity: 0; filter: blur(18px) saturate(1.4); transform: perspective(1100px) translateZ(-70px) translateX(18px) scale(1.06); }
    55%  { opacity: 1; }
    100% { opacity: 1; filter: blur(0) saturate(1); transform: perspective(1100px) translateZ(0) translateX(0) scale(1); }
  }
  @keyframes screenInL {
    0%   { opacity: 0; filter: blur(18px) saturate(1.4); transform: perspective(1100px) translateZ(-70px) translateX(-18px) scale(1.06); }
    55%  { opacity: 1; }
    100% { opacity: 1; filter: blur(0) saturate(1); transform: perspective(1100px) translateZ(0) translateX(0) scale(1); }
  }
  .screen-in-r { animation: screenInR .3s var(--ease) both; }
  .screen-in-l { animation: screenInL .3s var(--ease) both; }
  @keyframes screenOut {
    0%   { opacity: 1; filter: blur(0); transform: translateZ(0); }
    100% { opacity: 0; filter: blur(12px); transform: perspective(1100px) translateZ(-40px); }
  }
  .screen-in { animation: screenIn .3s var(--ease) both; }
  .fx-in { animation: screenIn .3s var(--ease) both; }
  .fx-out { animation: screenOut .16s ease-in both; }
  .fx-item { animation: screenIn .3s var(--ease) both; animation-delay: calc(var(--i, 0) * 28ms); }
  .screen-out { animation: screenOut .12s ease-in both; pointer-events: none; }
  /* 首次打开主窗：整窗虚化聚焦进场（侧栏与主区微错峰，更有机） */
  body.boot-in aside.side { animation: screenIn .32s var(--ease) both; }
  body.boot-in .main { animation: screenIn .32s var(--ease) .05s both; }
  @media (prefers-reduced-motion: reduce) {
    .fx-in, .fx-out, .fx-item { animation: none; }
    body.boot-in aside.side, body.boot-in .main { animation: none; }
    .screen-in-r, .screen-in-l, .detail-tween { animation: none; }
    .modal { animation: none; }
    .nav .n.bump { animation: none !important; }
    * { transition: none !important; }
  }

  /* ---------- 弹窗：3D 浮起卡片 + 背景虚化 ---------- */
  .mask {
    position: fixed; inset: 0; background: rgba(10,12,11,.5); backdrop-filter: blur(8px) saturate(1.1);
    display: flex; align-items: center; justify-content: center; z-index: 99;
    animation: maskIn .25s ease both;
  }
  @keyframes maskIn { from { opacity: 0; backdrop-filter: blur(0); } to { opacity: 1; backdrop-filter: blur(8px); } }
  /* 详情面板条目切换：一次性轻量上浮渐入（renderDetail 重触发；只动 transform/opacity，无 layout 抖动） */
  @keyframes detailTween {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .detail-tween { animation: detailTween .22s cubic-bezier(.22,1,.36,1) both; }
  .modal {
    width: 540px; max-width: 92vw; max-height: 82vh; overflow: auto; border-radius: 18px;
    padding: 22px 24px; color: var(--ink);
    background: rgba(16, 22, 19, 0.62);
    -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
    border: 1px solid rgba(255,255,255,.13); border-bottom-color: rgba(0,0,0,.5);
    box-shadow: var(--sh-3), 0 0 0 1px rgba(0,0,0,.4);
    animation: modalPopIn .22s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes modalPopIn {
    from { opacity: 0; transform: scale(.96); filter: blur(6px); }
    to   { opacity: 1; transform: scale(1); filter: blur(0); }
  }
  .modal h3 { font-size: 15px; color: #f2f5f1; margin-bottom: 14px; }
  .modal .mhint { font-size: 11.5px; color: var(--ink-3); line-height: 1.7; margin-bottom: 12px; }
  .modal .frow { margin-bottom: 12px; }
  .modal .frow label { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 5px; }
  .modal .frow input, .modal .frow textarea {
    width: 100%; border: 1px solid rgba(255,255,255,.14); border-bottom-color: rgba(0,0,0,.4);
    border-radius: 9px; padding: 9px 11px; font-size: 13px; font-family: inherit; outline: none; color: var(--ink);
    background: rgba(12, 18, 15, 0.42); box-shadow: var(--sh-1);
    transition: border-color .2s, box-shadow .2s;
  }
  .modal .frow input:focus, .modal .frow textarea:focus { border-color: rgba(103,194,143,.6); box-shadow: 0 0 0 3px rgba(67,160,110,.16), var(--sh-1); }
  .modal .frow input::placeholder, .modal .frow textarea::placeholder { color: var(--ink-3); }
  .modal .mbtns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  .mbody { font-size: 13.5px; line-height: 1.85; letter-spacing: .015em; color: #e2e6df; white-space: pre-wrap; }
  .rev-item { border: 1px solid rgba(255,255,255,.11); border-bottom-color: rgba(0,0,0,.35);
    background: rgba(255, 255, 255, 0.06); border-radius: 11px; padding: 11px 13px; margin-bottom: 8px; cursor: pointer;
    box-shadow: var(--sh-1); transition: transform .18s var(--ease), box-shadow .18s, border-color .18s, background .18s; }
  .rev-item:hover { transform: translateY(-2.5px) scale(1.01); box-shadow: var(--sh-3); border-color: rgba(103,194,143,.5); background: rgba(255,255,255,.11); }
  .rev-item:active { transform: translateY(0) scale(.995); box-shadow: var(--sh-1); transition-duration: .06s; }
  .rev-item .rt { font-size: 13px; font-weight: 650; color: #eef1ed; }
  .rev-item .rm { font-size: 11px; color: var(--ink-3); margin-top: 3px; }

  /* ---------- Toast：3D 浮标 ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    padding: 10px 22px; border-radius: 99px; font-size: 12.5px; color: #f2faf5; z-index: 200;
    background: rgba(67, 160, 110, 0.5);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.2); border-bottom-color: rgba(0,0,0,.4);
    box-shadow: 0 1px 0 rgba(255,255,255,.2) inset, 0 14px 28px -8px rgba(0,0,0,.5), 0 3px 8px rgba(0,0,0,.3);

    <div class="nav" id="srsBtn" title="艾宾浩斯记忆复习（⌘⇧R）">🔁 今日复习 <span class="n" id="srsCount" style="display:none"></span></div>
    <div class="nav" id="resurfaceBtn" title="资料级回看：没打星、没金句的资料也会定期回到眼前">🔍 该回看了 <span class="n" id="resurfaceCount" style="display:none"></span></div>
    <div class="navsec">图 片</div>
    <div class="nav" id="ivBtn" title="图片收藏夹：与桌面版「自制图片收藏夹」共用同一收藏库。拖图 / 粘贴即收藏，可分类与附提示词。悬浮按钮上方圆钮、右键菜单也能打开。">🖼 图片收藏夹</div>
    <div class="navsec">分 类</div>
    <div id="catList"></div>
    <div class="nav" id="catAddBtn" style="color:var(--ink-3)" title="新建分类，可用 / 建子类，如 教程课程/视频制作">＋ 新建分类</div>
    <div class="sidebtns">
      <div class="streakbar" id="streakBar">
        <div class="sb-line" id="sbLine"></div>
        <div class="sb-title" id="sbTitleRow"></div>
        <div class="sb-track" id="sbTrack"><div class="sb-fill" id="sbFill"></div></div>
      </div>
      <button class="sidebtn" id="taxonomyBtn">🧠 分类画像</button>
      <button class="sidebtn" id="organizeBtn">🧹 整理积压</button>
      <button class="sidebtn" id="reviewBtn">每日 / 周复盘</button>
      <button class="sidebtn" id="settingsBtn">设置 · AI 归类 · 迁移</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h2 id="viewTitle">全部资料</h2>
      <span class="spacer"></span>
      <div class="kindbar" id="kindBar">
        <span class="kchip active" data-k="all">全部</span>
        <span class="kchip" data-k="url">链接</span>
        <span class="kchip" data-k="file">文件</span>
        <span class="kchip" data-k="video">🎬 视频</span>
        <span class="kchip" data-k="image">🖼 图片</span>
        <span class="kchip" data-k="chat">聊天</span>
        <span class="kchip" data-k="note">笔记</span>
        <span class="kchip" data-k="conclusion">结论</span>
        <span class="kchip" data-k="method">方法</span>
        <span class="kchip" data-k="todo">待办</span>
        <span class="kchip" data-k="idea">点子</span>
      </div>
      <span class="view-toggle" id="multiBtn" title="批量整理资料">多选</span>
      <select class="tagfilter" id="tagFilter"><option value="">按标签筛选</option></select>
      <select class="sortsel" id="sortSel">
        <option value="newest">最新优先</option>
        <option value="oldest">最早优先</option>
        <option value="title">标题排序</option>
      </select>
      <button class="btn3d" id="addBtn">＋ 收录</button>
    </div>
    <div class="content">
      <div class="list" id="list"></div>
      <div class="detail" id="detail"><div class="empty">← 从左侧选择一条资料</div></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="dropmask" id="dropmask">
    <div class="dz">
      <b>松开即收录</b>
      <span>视频 / 图片：只建索引，不复制文件，播放时打开原位置<br>文档：抽取全文后归档 · 链接：直接收录</span>
    </div>
  </div>
  <div class="bulkbar" id="bulkBar">
    <span>已选 <b id="bulkCount">0</b></span>
    <span class="bulk-sep">·</span>
    <button class="btn-ghost" id="bulkCat">改分类</button>
    <button class="btn-ghost" id="bulkDel" style="color:#e08a7a">删除</button>
    <span class="bulk-sep">|</span>
    <button class="btn-ghost" id="bulkCancel">取消</button>
  </div>

<script src="../shared/flow-ui.js"></script>
<script src="../src/reuse-workbench.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let state = { view: 'all', q: '', category: '', tag: '', favorites: false, from: null, to: null, sort: 'newest', kind: 'all' };
  let items = [], facets = { categories: {}, tags: {} }, currentId = null;
  let pendingHighlight = null;
  let quoteMode = false; // 金句栏模式
  let stats = null;           // getStats 缓存（供成就墙 / 积累条刷新对比）
  let milestoneBound = false; // onMilestone 只绑一次

  const KINDS = { url: '链接', file: '文件', chat: '聊天', note: '笔记', bundle: '文件包', video: '视频', image: '图片', conclusion: '结论', method: '方法', todo: '待办', idea: '点子' };
  const KIND_CLS = { url: 'burl', file: 'bfile', chat: 'bchat', note: 'bnote', bundle: 'bfile', video: 'bvideo', image: 'bimg', conclusion: 'bnote', method: 'bfile', todo: 'bchat', idea: 'burl' };

  // 本地文件 → file:// URL（中文/空格路径安全编码；详情页画廊与卡片缩略图用）
  function fileUrl(p) { return 'file://' + String(p || '').split('/').map(encodeURIComponent).join('/'); }

  // 时长 / 文件大小展示（视频索引条目用；与 src/video.js 同规则）
  function fmtDur(sec) {
    const s = Number(sec);
    if (!Number.isFinite(s) || s <= 0) return '';
    const total = Math.round(s), h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), ss = total % 60;
    const two = (n) => String(n).padStart(2, '0');
    return h > 0 ? `${h}:${two(m)}:${two(ss)}` : `${m}:${two(ss)}`;
  }
  function fmtSize(bytes) {
    const b = Number(bytes);
    if (!Number.isFinite(b) || b <= 0) return '';
    if (b >= 1024 ** 3) return (b / 1024 ** 3).toFixed(2) + ' GB';
    if (b >= 1024 ** 2) return (b / 1024 ** 2).toFixed(1) + ' MB';
    return Math.round(b / 1024) + ' KB';
  }

  // ---------- 越积累越上瘾：积累条 / 成就墙 / 里程碑推送（接口未就绪时全部静默降级） ----------
  async function renderStatsBar() {
    try {
      if (!window.vault || typeof window.vault.getStats !== 'function') return;
      const s = await window.vault.getStats();
      if (!s || typeof s !== 'object') return;
      stats = s;
      // 侧栏积累条：藏品 · 🔥连续 · 本周 +N；下面细的称号进度条
      const bar = $('streakBar'), line = $('sbLine'), tRow = $('sbTitleRow'), fill = $('sbFill');
      if (!bar || !line || !tRow || !fill) return;
      bar.classList.add('show');
      line.innerHTML = `<b>${Number(s.total || 0)}</b> 件藏品<span class="sb-sep"> · </span>🔥连续 <b>${Number(s.streak || 0)}</b> 天<span class="sb-sep"> · </span>本周 <b class="sb-next">+${Number(s.weekCount || 0)}</b>`;
      const ms = s.nextMilestone;
      const target = ms && ms.target > 0 ? ms.target : null;
      if (target) {
        const progress = Math.max(0, Math.min(100, Math.round((Number(ms.progress) || 0) / target * 100)));
        tRow.innerHTML = `<span><span class="cur">${esc(s.title || '新手上路')}</span><span class="sb-sep"> → </span><span class="sb-next">还差 ${Math.max(0, target - (Number(ms.progress) || 0))}</span></span><span>${progress}%</span>`;
        fill.style.width = progress + '%';
      } else {
        tRow.innerHTML = `<span><span class="cur">${esc(s.title || '新手上路')}</span></span><span class="sb-next">已是最高 ✦</span>`;
        fill.style.width = '100%';
      }
      renderAchievements(s);
    } catch (e) { /* 接口未就绪 / 任何异常：保持隐藏，不影响主界面 */ }
  }
  // 积累条点击 → 平滑滚到成就墙（离成就最近的地方一眼可达）
  function bindStreakBar() {
    const bar = $('streakBar');
    if (!bar || bar.dataset.bound) return;
    bar.dataset.bound = '1';
    bar.addEventListener('click', () => {
      if (quoteMode) { toast('先从金句视图返回列表再看成就'); return; }
      const panel = $('achvPanel');
      if (panel && panel.style.display !== 'none') panel.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      else toast('收录更多资料后点亮第一枚成就');
    });
  }

  // 成就墙：只更新有变化的卡片（无整表重渲染、不闪断 hover）
  function renderAchievements(s) {
    try {
      const panel = $('achvPanel'), grid = $('achvGrid');
      if (!panel || !grid || !s || !Array.isArray(s.badges) || !s.badges.length) { if (panel) panel.style.display = 'none'; return; }
      panel.style.display = '';
      const earnedCount = s.badges.filter(b => b && b.earned).length;
      const countEl = $('achvCount');
      if (countEl) countEl.textContent = `${earnedCount} / ${s.badges.length}`;
      s.badges.forEach(b => {
        if (!b || !b.id) return;
        let el = grid.querySelector(`[data-bid="${b.id}"]`);
        if (!el) {
          el = document.createElement('div');
          el.className = 'achv-item';
          el.dataset.bid = b.id;
          el.innerHTML = `<span class="ai"></span><div class="acol"><div class="al"></div><div class="ad"></div></div>`;
          grid.appendChild(el);
        }
        const icon = el.querySelector('.ai'), lb = el.querySelector('.al'), de = el.querySelector('.ad');
        if (icon && icon.textContent !== (b.icon || '🏅')) icon.textContent = b.icon || '🏅';
        if (lb && lb.textContent !== b.label) lb.textContent = b.label || '';
        if (de && de.textContent !== (b.desc || '')) de.textContent = b.desc || '';
        el.classList.toggle('locked', !b.earned);
      });
    } catch (e) { /* 静默降级 */ }
  }

  // 成就详情：点击成就卡弹小卡（icon + 说明 + 达成时间；未达成显示鼓励文案）
  // #achvPanel 内嵌在 #detail 里每次 renderDetail 会重建，故用 document 级委托，永不失效
  function bindAchvDetails() {
    if (bindAchvDetails._bound) return;
    bindAchvDetails._bound = true;
    document.addEventListener('click', (e) => {
      const card = e.target.closest('.achv-item');
      if (!card) return;
      const b = stats && Array.isArray(stats.badges) ? stats.badges.find(x => x && x.id === card.dataset.bid) : null;
      if (!b) return;
      const div = modalShell('成就详情');
      const timeLine = b.earned
        ? (b.achievedAt ? `🏆 达成于 ${new Date(b.achievedAt).toLocaleString('zh-CN', { year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}` : '已达成 · 日期未记录')
        : '再加把劲，就差一点点！';
      div.querySelector('.mbody').innerHTML = `
        <div style="text-align:center;padding:8px 0 2px">
          <div style="font-size:44px;line-height:1.3;filter:drop-shadow(0 8px 18px rgba(0,0,0,.45));${b.earned ? '' : 'filter:grayscale(1);opacity:.5'}">${esc(b.icon || '🏅')}</div>
          <div style="font-size:15px;font-weight:700;color:#f2f5f1;margin-top:8px">${esc(b.label || '')}</div>
          <div style="font-size:12.5px;color:var(--ink-2);line-height:1.8;margin-top:8px">${esc(b.desc || '')}</div>
          <div style="font-size:11.5px;color:${b.earned ? '#d9a97a' : 'var(--ink-3)'};margin-top:12px">${esc(timeLine)}</div>
        </div>`;
    });
  }

  // 里程碑达成：toast + 一次性 scale 脉冲（CSS class + setTimeout 移除，性能友好）
  function bindMilestone() {
    try {
      if (milestoneBound || !window.vault || typeof window.vault.onMilestone !== 'function') return;
      milestoneBound = true;
      window.vault.onMilestone((m) => {
        if (!m) return;
        toast(`🎖️ 成就达成 · ${m.label || ''}`);
        pulseEl($('streakBar'));
        const card = document.querySelector(`.achv-item[data-bid="${m.kind}"]`);
        pulseEl(card);
        renderStatsBar();
      });
    } catch (e) { /* 静默降级 */ }
  }
  function pulseEl(el) {
    if (!el) return;
    el.classList.remove('pulse-once');
    void el.offsetWidth; // 强制 reflow，允许连续触发时重新播放
    el.classList.add('pulse-once');
    setTimeout(() => el.classList.remove('pulse-once'), 750);
  }

  // C-QA-SEARCH-02 修复：刷新代序与用户选择守卫。
  // 竞态：180ms 防抖后的异步 refresh 完成时无条件 currentId=null，会清掉用户在防抖窗/检索在途期间点开的有效详情，
  // 且较早查询晚返回会覆盖较新查询的结果。守卫：①过期结果直接丢弃；②刷新期间用户点选过卡片则不清空选择。
  let refreshSeq = 0; let pickSeq = 0; let inputGuard = null; let navSeq = 0;
  async function refresh(keepId, animate, pickedAtOverride) {
    const seq = ++refreshSeq;      // 本次刷新的代序
    // 清空基准：搜索刷新取「输入那一刻」的选卡/视图快照（防抖窗内的点击、输入后切换的视图都视为更新状态）；
    // 其余刷新取执行时刻（保持视图/筛选切换的原清空语义）
    const pickedAt = pickedAtOverride ? pickedAtOverride.pick : pickSeq;
    const navAtStart = pickedAtOverride ? pickedAtOverride.nav : navSeq;
    // 搜索走倒排索引（标题×3/小标题×2/正文×1，BM25），其余筛选走原通道
    let listData, totalCount;
    let facetsNext = facets; // C-QA-SEARCH-03：facets 一并在代序守卫通过后才提交，过期任务不写任何共享状态
    if (state.q) {
      const hits = await window.vault.searchIndex(state.q, 300);
      listData = hits;
      totalCount = hits.length;
      // 索引召回后在内存里套用其余筛选， facets 仍取全量；列表头部展示相关度
      if (state.category && state.category !== '全部') listData = listData.filter(i => i.category === state.category);
      if (state.tag) listData = listData.filter(i => (i.tags || []).includes(state.tag));
      if (state.kind && state.kind !== 'all') listData = listData.filter(i => i.kind === state.kind);
      if (state.favorites) listData = listData.filter(i => i.favorite);
      const full = await window.vault.list({ limit: 1 });
      facetsNext = full.facets;
    } else if (state.view === 'resurface' && window.vault.resurfaceToday) {
      listData = await window.vault.resurfaceToday();
      listData = listData.map(x => ({ ...x, _resurface: true }));
      const full = await window.vault.list({ limit: 1 });
      facetsNext = full.facets; totalCount = listData.length;
    } else if (state.view === 'used' && window.vault.libraryRecentUsed) {
      listData = await window.vault.libraryRecentUsed();
      const full = await window.vault.list({ limit: 1 });
      facetsNext = full.facets; totalCount = listData.length;
    } else if (state.view === 'frequent' && window.vault.libraryFrequentUsed) {
      listData = await window.vault.libraryFrequentUsed();
      const full = await window.vault.list({ limit: 1 });
      facetsNext = full.facets; totalCount = listData.length;
    } else if ((state.view === 'extracts' || ['conclusion', 'method', 'todo'].includes(state.kind)) && window.vault.extractList) {
      const exs = await window.vault.extractList(state.kind && state.kind !== 'all' && state.kind !== 'idea' ? { kind: state.kind } : {});
      listData = (exs || []).map(x => ({
        id: 'ex:' + x.id, title: x.title, kind: x.kind, category: '整理',
        summary: (x.ai_draft ? 'AI 草稿 · ' : '') + (x.body || '').slice(0, 120),
        created_at: x.created_at, _resultType: x.kind, _extractId: x.id,
        _sourceItemId: x.source_item_id, source_message_ids: x.source_message_ids, tags: [],
      }));
      const full = await window.vault.list({ limit: 1 });
      facetsNext = full.facets; totalCount = listData.length;
    } else if (state.kind === 'idea' && window.vault.ideasList) {
      const r = await window.vault.ideasList();
      const all = [...(r.open || []), ...(r.done || []), ...(r.parked || [])];
      listData = all.map(i => ({
        id: 'idea:' + i.id, title: i.text, kind: 'idea', category: '点子',
        summary: (i.statusLabel || '') + (i.next_action ? ' · ' + i.next_action : ''),
        created_at: i.created_at, _resultType: 'idea', tags: [],
      }));
      const full = await window.vault.list({ limit: 1 });
      facetsNext = full.facets; totalCount = listData.length;
    } else {
      const f = { q: '', category: state.category, tag: state.tag, favorites: state.favorites, from: state.from, to: state.to, sort: state.sort, kind: state.kind, limit: 300 };
      const r = await window.vault.list(f);
      listData = r.items; facetsNext = r.facets; totalCount = r.total;
    }
    if (state.sort === 'oldest') listData.sort((a, b) => a.created_at - b.created_at);
    else if (state.sort === 'title') listData.sort((a, b) => String(a.title).localeCompare(String(b.title), 'zh'));
    if (seq !== refreshSeq) return; // 已有更新的查询/视图接管：丢弃本次（过期）结果，不写任何共享状态/DOM
    facets = facetsNext; // 过期任务在写 items/facets/左栏之前已被上面的守卫拒绝
    items = listData;
    renderCats(); renderTags(); renderList(!!animate);
    renderNewCatBanner();
    if (!keepId && pickedAt === pickSeq && navAtStart === navSeq) { currentId = null; renderDetail(); } // 用户在刷新期间点选过卡片或切过视图则不动详情；视图/筛选切换的正常清空不变
    renderStatsBar(); // 积累条 / 成就墙跟随现有刷新时机（内部已容错）
    refreshReuseCount(); // C 轮：继续使用角标跟随刷新（内部已容错）
  }

  // 建类建议横幅：分类引擎置信度不足时提议单开一类，点横幅一键建类并归档
  let newCatCandidates = [];
  async function renderNewCatBanner() {
    const listEl = $('list');
    const old = listEl.querySelector('.newcat-banner');
    if (old) old.remove();
    try {
      if (!window.vault || typeof window.vault.list !== 'function') return;
      const r = await window.vault.list({ limit: 60 });
      const cands = (r.items || []).filter(i => i.suggest_new_category && i.suggest_new_category.name && i.category === '资料收藏');
      newCatCandidates = cands;
      if (!cands.length) return;
      const first = cands[0];
      const div = document.createElement('div');
      div.className = 'newcat-banner';
      div.innerHTML = `<span class="nb-ico">💡</span>
        <span class="nb-txt">「<b>${esc(first.title.slice(0, 24))}</b>」的阐述提到 <b>「${esc(first.suggest_new_category.name)}」</b>，现有分类都不贴。${cands.length > 1 ? `（还有 ${cands.length - 1} 条类似）` : ''}</span>
        <span class="nb-act">一键建类 →</span>`;
      div.addEventListener('click', async () => {
        try {
          const sugName = first.suggest_new_category.name;
          // 改名式建类：预填建议名，用户可直接改名后确认
          const r = await uiForm('创建新分类', [
            { key: 'name', label: '分类名称', value: sugName, ph: '建议名：' + sugName },
          ], '可直接改名，确认后该条资料将归入此类');
          if (!r) return; // 取消则无动作
          const finalName = String(r.name || '').trim() || sugName;
          const made = await window.vault.taxonomyCreate(sugName, first.id, finalName);
          if (made && made.ok) {
            div.classList.add('dismissed');
            setTimeout(() => div.remove(), 300);
            toast('✨ 已创建分类「' + finalName + '」并归入');
            screenSwap(() => refresh());
          } else {
            toast((made && made.error) || '建类失败');
          }
        } catch (e) { toast('建类失败，稍后再试'); }
      });
      listEl.insertBefore(div, listEl.firstChild);
    } catch (e) { /* 静默降级 */ }
  }

  // ---------- 新建分类：支持层级名（父/子，如 教程课程/视频制作），父类自动创建 ----------
  $('catAddBtn').addEventListener('click', async () => {
    if (typeof window.vault.taxonomyCreate !== 'function') { toast('接口未就绪，请重启应用'); return; }
    const div = modalShell('🗂 新建分类');
    const body = div.querySelector('.mbody');
    body.innerHTML = `<input class="editbox" id="nmInput" style="width:100%" placeholder="分类名（可用 / 建层级，如：教程课程/视频制作）">
      <div style="font-size:11px;color:var(--ink-3);margin-top:8px;line-height:1.7">· 最多三级：大类 / 子类 / 细分　· 每级 1~12 个字<br>· 父类不存在会自动创建　· 建好后在分类画像里给它配关键词，归类更准</div>`;
    const input = body.querySelector('#nmInput');
    input.focus();
    const doCreate = async () => {
      const v = input.value.trim();
      if (!v) return;
      const r = await window.vault.taxonomyCreate(v);
      if (r && r.ok) { toast('已创建分类「' + r.name + '」'); div.remove(); refresh(true); }
      else toast((r && r.error) || '创建失败');
    };
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doCreate();
      if (e.key === 'Escape') div.remove();
    });
    body.insertAdjacentHTML('beforeend', '<div style="margin-top:10px;text-align:right"><button class="btn-ghost" id="nmGo">创建</button></div>');
    body.querySelector('#nmGo').addEventListener('click', doCreate);
  });

  function renderCats() {
    const el = $('catList');
    const total = Object.values(facets.categories).reduce((a, b) => a + b, 0);
    // 层级树：全路径（如 教程课程/视频制作）拆段构树；父类计数含全部子孙；可折叠（记忆在 localStorage）
    let collapsed = new Set();
    try { collapsed = new Set(JSON.parse(localStorage.getItem('lv-cat-collapse') || '[]')); } catch {}
    const nodes = new Map();
    for (const p of Object.keys(facets.categories)) {
      const segs = p.split('/');
      for (let i = 0; i < segs.length; i++) {
        const path = segs.slice(0, i + 1).join('/');
        if (!nodes.has(path)) nodes.set(path, { self: 0, depth: i, name: segs[i] });
      }
      nodes.get(p).self = facets.categories[p];
    }
    for (const [p, n] of nodes) {
      let t = 0;
      for (const [q, m] of nodes) if (q === p || q.startsWith(p + '/')) t += m.self;
      n.total = t;
    }
    const sorted = [...nodes.entries()].sort((a, b) => a[0].localeCompare(b[0], 'zh'));
    const hiddenBy = (p) => {
      let anc = p.includes('/') ? p.split('/').slice(0, -1).join('/') : '';
      while (anc) { if (collapsed.has(anc)) return true; anc = anc.includes('/') ? anc.split('/').slice(0, -1).join('/') : ''; }
      return false;
    };
    const rows = sorted.filter(([p]) => !hiddenBy(p)).map(([p, n]) => {
      const hasKids = [...nodes.keys()].some(q => q.startsWith(p + '/'));
      const arrow = hasKids
        ? `<span class="cat-arrow" data-fold="${esc(p)}" title="${collapsed.has(p) ? '展开' : '收起'}子分类">${collapsed.has(p) ? '▸' : '▾'}</span>`
        : '<span class="cat-arrow none"></span>';
      const sub = n.depth > 0 ? `<span class="cat-path">…${esc(p.split('/').slice(-2, -1).join('/'))}</span>` : '';
      return `<div class="nav ${state.category === p ? 'active' : ''}" data-cat="${esc(p)}" style="padding-left:${12 + n.depth * 16}px">
        ${arrow}<span class="cat-label">${esc(n.name)}${sub}</span><span class="n">${n.total}</span></div>`;
    }).join('');
    el.innerHTML = `<div class="nav ${!state.category ? 'active' : ''}" data-cat="">全部 <span class="n">${total}</span></div>` + rows;
    el.querySelectorAll('.nav').forEach(n => n.addEventListener('click', (e) => {
      if (e.target.classList && e.target.classList.contains('cat-arrow')) return;
      const cat = n.dataset.cat || '';
      // 再点一次当前分类 = 反选（回到全部），快捷衔接
      if (state.category === cat && cat === '') return;
      state.category = (state.category === cat) ? '' : cat;
      screenSwap(() => refresh());
    }));
    el.querySelectorAll('.cat-arrow[data-fold]').forEach(a => a.addEventListener('click', (e) => {
      e.stopPropagation();
      const p = a.dataset.fold;
      if (collapsed.has(p)) collapsed.delete(p); else collapsed.add(p);
      try { localStorage.setItem('lv-cat-collapse', JSON.stringify([...collapsed])); } catch {}
      renderCats();
    }));
  }
  function renderTags() {
    const sel = $('tagFilter');

    sel.innerHTML = '<option value="">按标签筛选</option>' +
      Object.entries(facets.tags).sort((a, b) => b[1] - a[1]).map(([t, n]) => `<option value="${esc(t)}">${esc(t)} (${n})</option>`).join('');

  // 屏幕虚化→瞬间聚焦：包裹任何需要转场的刷新
  let swapDirection = ''; // '' | 'r' | 'l'：setView 按侧栏序写入，screenSwap 消费后清空
  function screenSwap(fn) {
    const content = document.querySelector('.content');
    content.classList.remove('screen-in', 'fx-in', 'screen-in-r', 'screen-in-l');
    content.classList.add('screen-out');
    setTimeout(() => {
      content.classList.remove('screen-out');
      content.classList.add(swapDirection === 'r' ? 'screen-in-r' : swapDirection === 'l' ? 'screen-in-l' : 'screen-in');
      swapDirection = '';
      if (fn) fn();
    }, 110);
  }

  function fmtTime(ts) {
    const d = new Date(ts), now = new Date();
    if (d.toDateString() === now.toDateString()) return d.toTimeString().slice(0, 5);
    if (d.getFullYear() === now.getFullYear()) return `${d.getMonth() + 1}/${d.getDate()}`;
    return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
  }

        ? `<div class="list-empty"><img class="empty-art" style="width:80px;height:80px" src="../assets/icon-512.png" alt="">当前没有需要回看的资料<br><span style="font-size:11.5px">资料符合回看条件时会出现在这里</span><br><span class="empty-action" id="showAllItems">查看全部资料</span></div>`
        : state.q || state.category || state.tag || state.favorites || (state.kind && state.kind !== 'all')
        ? `<div class="list-empty"><img class="empty-art" style="width:80px;height:80px" src="../assets/icon-512.png" alt="">这个筛选下没有资料<br><span class="empty-action" id="clearFilters">清除筛选，看全部</span></div>`
        : `<div class="list-empty"><img class="empty-art" style="width:92px;height:92px" src="../assets/icon-512.png" alt="">还没有资料<br><span class="empty-cta" id="emptyCta">＋ 收录第一条</span><br><span style="font-size:11.5px">或按 ⌘⇧L · 把文件拖到屏幕右侧悬浮按钮</span></div>`);
    const clearBtn = $('list').querySelector && $('list').querySelector('#clearFilters');
    const showAllBtn = $('list').querySelector && $('list').querySelector('#showAllItems');
    if (showAllBtn) showAllBtn.addEventListener('click', () => setView('all'));
    if (clearBtn) clearBtn.addEventListener('click', () => {
      state.q = ''; state.category = ''; state.tag = ''; state.favorites = false; state.kind = 'all';
      if ($('search')) $('search').value = '';
      const tagSel = $('tagFilter'); if (tagSel) tagSel.value = '';
      $('kindBar').querySelectorAll('.kchip').forEach(x => x.classList.toggle('active', x.dataset.k === 'all'));
      document.querySelectorAll('#favToggle').forEach(b => b.classList && b.classList.remove('active'));
      screenSwap(() => refresh());
      toast('已清除全部筛选');

    // 空状态 CTA：一键打开快速收录
    const cta = $('list').querySelector('#emptyCta');
    if (cta) cta.addEventListener('click', () => window.vault.openQuick());
    $('list').querySelectorAll('.card').forEach(c => c.addEventListener('click', async (e) => {

      const rsBtn = e.target.closest('.rs-act');
      if (rsBtn) {
        e.stopPropagation();
        const rid = rsBtn.dataset.id, act = rsBtn.dataset.rs;
        if (act === 'open') {
          const it = items.find(x => x.id === rid);
          if (it) { pickSeq++; currentId = rid; renderDetail(); } // 回看打开同样计入用户选择
        } else if (act === 'snooze') {
          if (window.vault.resurfaceSnooze) { await window.vault.resurfaceSnooze(rid, 7); toast('7 天内不再提醒这条'); refresh(true); refreshResurfaceCount(); }
        } else if (act === 'dismiss') {
          if (window.vault.resurfaceDismiss) { await window.vault.resurfaceDismiss(rid); toast('本轮不再提醒这条'); refresh(true); refreshResurfaceCount(); }
        }
        return;
      }
      // 徽标点击 = 跨模块联动筛选（不触发卡片选中）
      const badge = e.target.closest('.clickable');
      if (badge && !multiMode) {
        e.stopPropagation();
        if (badge.dataset.cat) {
          state.category = badge.dataset.cat;
          state.tag = '';
          screenSwap(() => refresh());
          toast('已筛选分类「' + badge.dataset.cat + '」');
        } else if (badge.dataset.tag) {
          state.tag = badge.dataset.tag;
          state.category = '';
          screenSwap(() => refresh());
          toast('已筛选标签「' + badge.dataset.tag + '」');
        } else if (badge.dataset.kind) {
          const chip = $('kindBar').querySelector('[data-k="' + badge.dataset.kind + '"]');
          if (chip) chip.click();
        }
        return;
      }
      if (multiMode) { toggleMultiCard(c); return; } // 多选模式：点击 = 切换选中，不打开详情
      pickSeq++; // C-QA-SEARCH-02：用户真实选卡，后续 refresh 尾部不得清掉这个选择
      if (currentId === c.dataset.id) return;
      const prev = $('list').querySelector('.card.active');
      if (prev) prev.classList.remove('active');
      c.classList.add('active');
      currentId = c.dataset.id;
      const hit = items.find(x => x.id === currentId);
      if (hit && hit._extractId) { await showExtract(hit._extractId); return; }
      if (hit && String(currentId).startsWith('idea:')) {window.vault.ideasOpen(currentId.slice(5)); return;}
      renderDetail();
    }));
  }

  function firstSent(s) { s = String(s || '').trim().replace(/\s+/g, ' '); return s.slice(0, 60); }

  // ---------- 图片 lightbox：全屏查看 + 左右翻页（Esc/点空白关闭） ----------
  let lbFiles = [];
  let lbIdx = 0;
  function openLightbox(files, idx) {
    lbFiles = files || [];
    lbIdx = idx || 0;
    let lb = $('lightbox');
    if (!lb) {
      lb = document.createElement('div');
      lb.id = 'lightbox';
      lb.innerHTML = '<img alt=""><div class="lb-x">✕</div><div class="lb-nav"><span id="lbPrev">‹</span><span id="lbNext">›</span></div>';
      document.body.appendChild(lb);
      lb.addEventListener('click', (e) => {
        if (e.target === lb || e.target.classList && e.target.classList.contains('lb-x')) lb.classList.remove('show');
      });
      document.addEventListener('keydown', (e) => {
        if (!lb.classList.contains('show')) return;
        if (e.key === 'Escape') lb.classList.remove('show');
        if (e.key === 'ArrowLeft') lbStep(-1);
        if (e.key === 'ArrowRight') lbStep(1);
      });
      // 滚轮缩放（0.4~5×）· 双击复位 · 放大后拖拽平移
      const lbImg = lb.querySelector('img');
      lb.addEventListener('wheel', (e) => {
        if (!lb.classList.contains('show')) return;
        e.preventDefault();
        lbScale = Math.min(5, Math.max(0.4, lbScale * (e.deltaY < 0 ? 1.15 : 0.87)));
        lbApply();
      }, { passive: false });
      lbImg.addEventListener('dblclick', () => lbReset());
      let lbDrag = null;
      lbImg.addEventListener('mousedown', (e) => {
        if (lbScale <= 1) return;
        e.preventDefault();
        lbDrag = { x: e.clientX - lbTX, y: e.clientY - lbTY };
      });
      window.addEventListener('mousemove', (e) => {
        if (!lbDrag) return;
        lbTX = e.clientX - lbDrag.x; lbTY = e.clientY - lbDrag.y; lbApply();
      });
      window.addEventListener('mouseup', () => { lbDrag = null; });
    }
    showLb();
    lbReset();
    lb.classList.add('show');
  }
  function lbStep(d) { if (lbFiles.length) { lbIdx = (lbIdx + d + lbFiles.length) % lbFiles.length; lbReset(); showLb(); } }
  function showLb() {
    const lb = $('lightbox');
    if (lb && lbFiles.length) lb.querySelector('img').src = fileUrl(lbFiles[lbIdx]);
  }
  // 缩放/平移（滚轮缩放 · 拖拽平移 · 双击复位）
  let lbScale = 1, lbTX = 0, lbTY = 0;
  function lbReset() { lbScale = 1; lbTX = 0; lbTY = 0; lbApply(); }
  function lbApply() {
    const lb = $('lightbox');
    const img = lb && lb.querySelector('img');
    if (img) {
      img.style.transform = `translate(${lbTX}px, ${lbTY}px) scale(${lbScale})`;
      img.style.cursor = lbScale > 1 ? 'grab' : '';
    }
  }

  // ---------- 正文富渲染：按「[图N: 文件名]」行内占位把图片穿插回文章原位（与 Word 中位置一致） ----------
  // 兼容旧格式：文件名对不上时按序号 N 回退到 it.images[N-1]；图片清单缺失时按普通文本保留标记
  // 排版：# 标题行分级（.bh1-.bh3），其余行保持段落（限宽/行高在 .dtext 上）
  function renderRichBody(it) {
    let text = String(it.current_version_id ? (it.versions||[]).find(v=>v.id===it.current_version_id)?.content || it.notes || it.text || '' : it.text || '');
    if (!text.trim() && (it.kind === 'note' || it.current_version_id)) text = String(it.notes || '');
    if (!text.trim()) return '<i style="color:var(--ink-3)">（无正文 — 链接/文件可能仅保存了原始附件）</i>';
    const imgs = it.images || [];
    const marks = [...text.matchAll(/\[图(\d*)[:：]\s*([^\]\n]+?)\s*\]/g)];
    if (!marks.length && !/#\s/.test(text)) return esc(text.slice(0, 20000)).replace(/\n/g, '<br>');
    if (!marks.length) {
      const parts = [];
      renderHeadedParts(text.slice(0, 20000), parts);
      return parts.join('');
    }
    if (!imgs.length) return esc(text.slice(0, 20000)).replace(/\n/g, '<br>');
    const byFile = new Map(imgs.map(x => [x.filename, x]));
    const parts = [];
    let last = 0;
    const pushText = (t) => renderHeadedParts(t, parts);
    for (const m of marks) {
      pushText(text.slice(last, m.index));
      last = m.index + m[0].length;
      let img = byFile.get(m[2]);
      if (!img) {
        const n = parseInt(m[1], 10);
        if (Number.isFinite(n) && n >= 1 && n <= imgs.length) img = imgs[n - 1];
      }
      if (img) {
        const idx = imgs.indexOf(img);
        parts.push('<div class="bfig"><img src="' + fileUrl(img.file) + '" data-big="' + idx + '" loading="lazy" title="点击放大（←/→ 翻页，滚轮缩放）" alt=""></div>');
      } else {
        pushText(m[0]);
      }
    }
    pushText(text.slice(last));
    return parts.join('');
  }
  // 文本段 → 分级标题 + 段落（# → .bh1-.bh3；「第X章/节」行也升为二级标题）
  function renderHeadedParts(t, parts) {
    if (!t || !t.trim()) return;
    const lines = String(t).split('\n');
    let buf = [];
    const flush = () => { if (buf.length && buf.join('\n').trim()) parts.push('<div class="bpara">' + esc(buf.join('\n')) + '</div>'); buf = []; };
    for (const ln of lines) {
      const h = ln.match(/^(#{1,3})\s+(.{1,80})$/);
      if (h) { flush(); parts.push('<div class="bh' + h[1].length + '">' + esc(h[2]) + '</div>'); continue; }
      if (/^第[一二三四五六七八九十百\d]+[章节讲部篇]/.test(ln.trim()) && ln.trim().length <= 30) {
        flush(); parts.push('<div class="bh2">' + esc(ln.trim()) + '</div>'); continue;
      }
      buf.push(ln);
    }
    flush();
  }
  // 搜索命中高亮：查询词在标题/摘要里亮起来（Spotlight 式即时反馈）
  function hlText(s) {
    const raw = String(s ?? '');
    if (!state.q || !state.q.trim()) return esc(raw);
    let out = esc(raw);
    for (const w of state.q.trim().split(/\s+/)) {
      if (!w) continue;
      const pat = w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      try { out = out.replace(new RegExp(pat, 'gi'), (mm) => '<mark>' + mm + '</mark>'); } catch {}
    }
    return out;
  }

      ${it.kind === 'image' && it.source_path ? `<div class="imgview"><img src="${fileUrl(it.source_path)}" alt=""></div>${it.image && (it.image.width || it.image.size) ? `<div style="font-size:11px;color:var(--ink-3)">${it.image.width ? it.image.width + '×' + it.image.height : ''}${it.image.width && it.image.size ? ' · ' : ''}${it.image.size ? fmtSize(it.image.size) : ''}</div>` : ''}` : ''}
      ${it.source_item_id ? '<button class="btn-ghost" id="srcBtn" style="margin-top:8px">↩ 跳回来源文档</button>' : ''}

  // 关联知识：同源金句 / 同标签金句 / 同标签条目 —— 把孤立资料织成网
  async function renderRelated(it) {
    const box = $('relatedBox');
    if (!box || !window.vault || typeof window.vault.quotesRelated !== 'function') return;
    try {
      const rel = await window.vault.quotesRelated(it.id, it.tags || []);
      const qs = [...(rel.sameSource || []), ...(rel.sameTags || [])];
      const ritems = [...(rel.relatedItems || []), ...(rel.similar || [])];
      if (!qs.length && !ritems.length) { box.innerHTML = ''; return; }
      const simIds = new Set((rel.similar || []).map(x => x.id));
      box.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin:16px 0 6px">
          <span class="dlabel">关联知识</span>
        </div>
        ${qs.length ? `<div class="rel-row">${qs.slice(0, 4).map(q => `
          <div class="rel-q" data-qid="${esc(q.id)}" title="点击在金句库中查看编辑">
            <span class="rel-mark">❝</span>
            <span class="rel-text">${esc((q.text || '').slice(0, 52))}${(q.text || '').length > 52 ? '…' : ''}</span>
            ${q.source_item_id === it.id ? '<span class="rel-tag">同源</span>' : ''}
          </div>`).join('')}</div>` : ''}
        ${ritems.length ? `<div class="rel-row">${ritems.map(x => `
          <div class="rel-item" data-iid="${esc(x.id)}" title="点击打开该资料">
            <span class="rel-dot"></span>
            <span class="rel-text">${esc((x.title || '').slice(0, 40))}${(x.title || '').length > 40 ? '…' : ''}</span>
            ${simIds.has(x.id) ? '<span class="rel-tag dim">相似</span>' : ''}
          </div>`).join('')}</div>` : ''}`;
      box.querySelectorAll('.rel-q').forEach(n => n.addEventListener('click', () => {
        const qid = n.dataset.qid;
        window.vault.listQuotes({}).then(list => {
          const found = list.find(x => x.id === qid);
          currentId = null;
          enterQuoteMode();
          if (found) setTimeout(() => editQuote(found), 350); // 等金句视图渲染完再开编辑
        });
      }));
      box.querySelectorAll('.rel-item').forEach(n => n.addEventListener('click', () => {
        const iid = n.dataset.iid;
        // 「相似」条目点击 → 记录反馈信号（接口未就绪时静默跳过）
        try { if (simIds.has(iid) && window.vault && typeof window.vault.feedbackSimilar === 'function') window.vault.feedbackSimilar(it.id, iid); } catch (e2) { /* 静默 */ }
        state.category = ''; state.tag = ''; state.q = '';
        if ($('search')) $('search').value = '';
        exitQuoteMode();
        screenSwap(() => refresh(true).then(() => {
          const target = $('list').querySelector(`[data-id="${iid}"]`);
          if (target) { target.click(); target.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
        }));
      }));
    } catch (e) { /* 关联失败不影响主详情 */ }
  }

  // 近 7 天录入统计（3D 柱状小图）
  async function renderWeekChart() {
    const el = $('weekPanel');
    if (!el) return;
    const data = await window.vault.dailyCounts();
    const total = data.reduce((a, b) => a + b.count, 0);
    const max = Math.max(1, ...data.map(d => d.count));
    $('wpTotal').textContent = total + ' 条';
    $('wpChart').innerHTML = data.map((d, i) => `
      <div class="wp-col" title="${d.date} · ${d.count} 条">
        <span class="wp-num" style="opacity:${d.count ? 1 : .25}">${d.count || ''}</span>
        <div class="wp-bar ${i === data.length - 1 ? 'today' : ''}" style="--h:${Math.max(6, Math.round(d.count / max * 100))}%"></div>
        <span class="wp-day">${i === 6 ? '今' : '周' + '日一二三四五六'[new Date(d.date + 'T00:00:00').getDay()]}</span>
      </div>`).join('');
  }

  // ---------- 侧栏视图切换（带虚化渐入） ----------
  const VIEW_TITLES = { all: '全部资料', favorites: '★ 星标', today: '今日录入', week: '本周录入', used: '最近使用', frequent: '常用资料', extracts: '整理', resurface: '该回看了', reuse: '继续使用' };
  document.querySelectorAll('.nav[data-view]').forEach(n => n.addEventListener('click', () => setView(n.dataset.view)));
  const VIEW_SEQ = { all: 0, favorites: 1, today: 2, week: 3, resurface: 4, quotes: 5, used: 6, frequent: 7, extracts: 8 }; // 侧栏视图序：切换方向感用
  function setView(v) {
    navSeq++; // C-QA-SEARCH-02：视图切换代序，挂起的旧刷新不得清掉新视图内容
    refreshSeq++; // C-QA-SEARCH-03：视图切换使挂起的旧刷新整体失效（在其写 items/facets/左栏之前即被拒）
    const prevSeq = VIEW_SEQ[state.view]; // 旧视图序（更新 state 前取）
    if (v === 'quotes') { enterQuoteMode(); return; }
    if (v === 'reuse') { enterReuseMode(); return; }
    if (quoteMode) exitQuoteMode();
    if (reuseMode) exitReuseMode();
    // 方向感：有序视图之间切换按序号差分定方向；未登记视图（分类/标签等路径不会走 setView）保持中性
    if (Number.isInteger(prevSeq) && Number.isInteger(VIEW_SEQ[v]) && prevSeq !== VIEW_SEQ[v]) {
      swapDirection = VIEW_SEQ[v] > prevSeq ? 'r' : 'l';
    } else {
      swapDirection = '';
    }
    state.view = v; state.category = ''; state.favorites = false; state.from = state.to = null;
    if (v === 'resurface') { state.kind = 'all'; state.tag = ''; state.q = ''; const si = $('search'); if (si) si.value = ''; }
    const now = new Date();
    if (v === 'favorites') state.favorites = true;
    if (v === 'today') {
      const s = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      state.from = s; state.to = s + 86400000;
    }
    if (v === 'week') {
      const day = (now.getDay() + 6) % 7;
      const s = new Date(now.getFullYear(), now.getMonth(), now.getDate() - day).getTime();
      state.from = s; state.to = s + 7 * 86400000;
    }
    $('viewTitle').textContent = VIEW_TITLES[v] || '全部资料';
    // 屏幕虚化 → 瞬间聚焦（切视图播列表动画；搜索/筛选/入库原地刷新）
    screenSwap(() => refresh(false, true));
  }

  // ---------- C 轮：继续使用工作台（⚡） ----------
  // 数据全部来自既有接口；选择/分组逻辑在 src/reuse-workbench.js（纯函数）。
  let reuseMode = false;
  function exitReuseMode() { reuseMode = false; }
  async function fetchReuseInput() {
    const [r, exs, ir] = await Promise.all([
      window.vault.list({ limit: 300 }),
      window.vault.extractList ? window.vault.extractList({}) : Promise.resolve([]),
      window.vault.ideasList ? window.vault.ideasList() : Promise.resolve({ thisWeek: [] }),
    ]);
    return { items: (r && r.items) || [], extracts: exs || [], ideas: (ir && ir.thisWeek) || [] };
  }
  async function refreshReuseCount() {
    try {
      if (!window.ReuseWorkbench || !window.vault || typeof window.vault.list !== 'function') return;
      const inp = await fetchReuseInput();
      const feed = window.ReuseWorkbench.buildReuseFeed({ ...inp, now: Date.now() });
      const n = window.ReuseWorkbench.reuseBadgeCount(feed);

  }
  function enterReuseMode() {
    reuseMode = true;
    navSeq++; // 同上：进入工作台视为一次视图变更
    refreshSeq++; // C-QA-SEARCH-03：使挂起的旧搜索刷新失效（左栏不得被旧卡片重写；本视图有自己的渲染）
    if (multiMode) setMultiMode(false);

  async function renderReuseView() {
    const el = $('detail');
    $('list').innerHTML = '';
    el.classList.remove('fx-in'); void el.offsetWidth; el.classList.add('fx-in');
    if (!window.ReuseWorkbench || !window.vault || typeof window.vault.list !== 'function') {
      el.innerHTML = '<div class="empty">接口未就绪，请重启应用</div>';
      return;
    }
    let feed;
    try {
      const inp = await fetchReuseInput();
      feed = window.ReuseWorkbench.buildReuseFeed({ ...inp, now: Date.now() });
    } catch (e) {
      el.innerHTML = '<div class="empty">工作台加载失败，稍后再试</div>';
      return;
    }
    refreshReuseCount();
    const secHtml = feed.sections.map((s) => {
      const rows = s.entries.map((en, i) => `
        <div class="rw-row fx-item" style="--i:${Math.min(i, 8)}" data-ritem="${esc(en.itemId || '')}" data-rext="${esc(en.extractId || '')}" data-ract="${esc(en.action.id)}">
          <div class="rw-main">

      return `<div class="rw-sec">
        <div class="rw-sec-head">
          <span class="rw-sec-title">${esc(s.title)}</span>
          ${s.entries.length ? `<span class="rw-sec-count">${s.entries.length}${s.overflow ? `（共 ${s.entries.length + s.overflow} 条，只显示 ${s.entries.length}）` : ''}</span>` : ''}
          <span class="rw-sec-note">${esc(s.note)}</span>
        </div>
        ${rows || `<div class="rw-empty">${esc(s.emptyText)}</div>`}
        ${s.overflow ? `<div class="rw-more">其余 ${s.overflow} 条可在「最近使用 / 整理 / 对应分类」里找到</div>` : ''}
      </div>`;
    }).join('');
    el.innerHTML = `<div class="rw-wrap">
      <div class="rw-head">按接下来要做的事把资料带回来：使用 = 你明确记下的那次（打开不算）。这里没有分数，只列事。</div>
      ${secHtml}
    </div>`;
    el.querySelectorAll('.rw-row').forEach(row => row.addEventListener('click', async (e) => {
      const actBtn = e.target.closest('.rw-act');
      // data-ract 挂在行上；按钮只是视觉锚点，点击行任意位置都走同一动作
      const action = (actBtn && actBtn.dataset.ract) || row.dataset.ract || 'open-item';
      const itemId = row.dataset.ritem;
      const extractId = row.dataset.rext;
      if (action === 'open-extract' && extractId) { showExtract(extractId); return; }
      if (!itemId) return;
      await openItemForAction(itemId, action);

  }
  // 从工作台回到普通列表并打开该资料；record-use 动作会接着弹出「记一次使用」
  async function openItemForAction(itemId, action) {
    exitReuseMode();
    state.view = 'all'; state.category = ''; state.tag = ''; state.favorites = false; state.from = state.to = null;
    state.q = '';
    if ($('search')) $('search').value = '';
    document.querySelectorAll('.nav').forEach(n => n.classList.remove('active'));

    if (nav) nav.classList.add('active');
    $('viewTitle').textContent = '全部资料';

  // C-QA-SEARCH-02：input 时刻快照选卡/视图基准（防抖触发时据此判断清空与否），再走 180ms 防抖
  $('search').addEventListener('input', () => { inputGuard = { pick: pickSeq, nav: navSeq }; debouncedSearchRefresh(); });
  const debouncedSearchRefresh = debounce(() => { state.q = $('search').value.trim(); if (!quoteMode && !reuseMode) refresh(false, false, inputGuard); }, 180); // C-QA-SEARCH-03：旧计时器不得在继续使用/金句视图接管
  $('sortSel').addEventListener('change', () => { state.sort = $('sortSel').value; screenSwap(() => refresh()); });
  $('tagFilter').addEventListener('change', () => { state.tag = $('tagFilter').value; screenSwap(() => refresh()); });
  $('kindBar').addEventListener('click', (e) => {

  $('addBtn').addEventListener('click', () => window.vault.openQuick());
  $('ingestBtn').addEventListener('click', () => window.vault.openQuick());

  // ---------- 🔁 记忆复习入口：侧栏常驻计数，点击开复习窗 ----------
  // 计数徽标数字变化时的轻微弹跳；徽标 display:none（无计数）时不弹
  function bumpBadge(badge) {
    if (!badge) return;
    if (badge.style.display === 'none' || getComputedStyle(badge).display === 'none') return;
    badge.classList.remove('bump');
    void badge.offsetWidth; // 强制回流，连续更新也能重触发动画
    badge.classList.add('bump');
    const drop = () => badge.classList.remove('bump');
    badge.addEventListener('animationend', drop, { once: true });
    setTimeout(drop, 320); // 兜底摘除
  }
  async function refreshSrsCount() {
    try {
      const badge = $('srsCount');
      if (!badge) return;
      // P1 护栏口径：角标显示 min(待复习, 每日上限)，悬停看真实总数与积压建议
      if (typeof window.vault.srsGuard === 'function') {
        const g = await window.vault.srsGuard();
        badge.style.display = g.shown > 0 ? '' : 'none';
        badge.textContent = g.shown;
        bumpBadge(badge);
        badge.title = g.plan
          ? `实际到期 ${g.total} 张 · 积压建议：今天做 ${g.plan.suggestedLimit} 张，约 ${g.plan.spreadDays} 天消化`
          : `今日待复习 ${g.shown} 张`;
        return;
      }
      if (typeof window.vault.srsCount !== 'function') return;
      const n = await window.vault.srsCount();
      badge.style.display = n > 0 ? '' : 'none';
      badge.textContent = n;

  }
  $('srsBtn').addEventListener('click', () => {
    if (window.vault.srsOpen) window.vault.srsOpen();

  $('ivBtn').addEventListener('click', () => {

  if (window.vault.onSrsCount) window.vault.onSrsCount((payload) => {
    // P1 起 payload 为 {shown,total,plan}；旧格式（纯数字）兼容
    if (payload && typeof payload === 'object' && 'shown' in payload) {
      const badge = $('srsCount');
      if (badge) {
        badge.style.display = payload.shown > 0 ? '' : 'none';
        badge.textContent = payload.shown;
        bumpBadge(badge);
        badge.title = payload.plan
          ? `实际到期 ${payload.total} 张 · 积压建议：今天做 ${payload.plan.suggestedLimit} 张，约 ${payload.plan.spreadDays} 天消化`
          : `今日待复习 ${payload.shown} 张`;
      }
      return;
    }
    refreshSrsCount();
  });
  refreshSrsCount();

  // ---------- 🔍 该回看了入口：侧栏常驻计数，点击切到 resurface 视图 ----------

  // C 轮：继续使用角标（待验证改进 + 待处理项；内部已容错）

  // ---------- 视频文件夹批量索引：选目录 → 并行扫描/探测 → 只建索引不复制 ----------
  $('scanVideoBtn').addEventListener('click', async () => {

  // ---------- 多选批量归类：进入/退出只切 class，不重建列表 DOM ----------
  let multiMode = false;

  // ---------- 自定义关键词编辑器：分类画像弹窗内展开/编辑/保存 ----------
  // 权重语义：1 泛词 · 2 相关 · 3 强信号 · 4 专属词 · 5 决定性词
  const KW_W_LABEL = { 1: '泛词', 2: '相关', 3: '强信号', 4: '专属', 5: '决定性' };
  async function bindKeywordEditors(body) {
    if (typeof window.vault.taxonomyRules !== 'function') return;
    let rulesCache = null;
    try { const r = await window.vault.taxonomyRules(); rulesCache = (r && r.rules) || {}; } catch { return; }
    body.querySelectorAll('.tp-kwbtn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const cat = btn.dataset.cat;
        const slot = body.querySelector(`.kw-slot[data-slot="${CSS.escape(cat)}"]`);
        if (!slot) return;
        if (slot.dataset.open === '1') { slot.innerHTML = ''; slot.dataset.open = '0'; return; }
        slot.dataset.open = '1';
        if (!rulesCache[cat]) rulesCache[cat] = { keywords: {} };
        const draft = { ...(rulesCache[cat].keywords || {}) };
        const render = () => {
          const chips = Object.entries(draft).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'zh')).map(([w, wt]) =>
            `<span class="kw-chip" data-w="${esc(w)}" title="点击调权重：${KW_W_LABEL[wt] || wt}">${esc(w)}<b>×${wt}</b><span class="kw-x" data-x="${esc(w)}">✕</span></span>`).join('');
          slot.innerHTML = `<div class="kw-editor">
            <div class="kw-chips">${chips || '<span class="kw-empty">暂无关键词——点击下方添加</span>'}</div>
            <div class="kw-add">
              <input class="kw-input" placeholder="新增关键词，如：分镜 / 白皮书" maxlength="30">
              <select class="kw-wsel">${[1, 2, 3, 4, 5].map(n => `<option value="${n}" ${n === 3 ? 'selected' : ''}>${n}·${KW_W_LABEL[n]}</option>`).join('')}</select>
              <button class="kw-addbtn">添加</button>
              <button class="kw-savebtn">保存</button>
            </div>
            <div class="kw-hint">权重：1 泛词 · 2 相关 · 3 强信号 · 4 专属词 · 5 决定性词 ｜ 标题命中 ×3 · 阐述 ×2.5 · 正文 ×1</div>
          </div>`;
          slot.querySelectorAll('.kw-chip').forEach(ch => ch.addEventListener('click', (ev) => {
            if (ev.target.classList && ev.target.classList.contains('kw-x')) return;
            const w = ch.dataset.w;
            draft[w] = (Number(draft[w]) % 5) + 1; // 点击循环调权重 1→…→5→1
            render();
          }));
          slot.querySelectorAll('.kw-x').forEach(x => x.addEventListener('click', (ev) => {
            ev.stopPropagation();
            delete draft[x.dataset.x];
            render();
          }));
          const input = slot.querySelector('.kw-input');
          const addAct = () => {
            const word = String(input.value || '').trim().toLowerCase();
            if (!word) return;
            draft[word] = Number(slot.querySelector('.kw-wsel').value) || 3;
            render();
          };
          slot.querySelector('.kw-addbtn').addEventListener('click', addAct);
          input.addEventListener('keydown', (e2) => { if (e2.key === 'Enter') addAct(); });
          slot.querySelector('.kw-savebtn').addEventListener('click', async () => {
            const sb = slot.querySelector('.kw-savebtn');
            sb.textContent = '保存中…';
            try {
              const r2 = await window.vault.taxonomySetKeywords(cat, draft);
              if (r2 && r2.ok) { rulesCache[cat] = { keywords: r2.keywords }; sb.textContent = '已保存 ✓'; toast(`「${cat}」关键词已更新，新收录与重新归类即刻生效`); }
              else { sb.textContent = '保存失败'; toast((r2 && r2.error) || '保存失败'); }
            } catch { sb.textContent = '保存失败'; }
            setTimeout(() => { const s = slot.querySelector('.kw-savebtn'); if (s) s.textContent = '保存'; }, 1600);
