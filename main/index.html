  // ---------- 分类画像：每个分类的学习主题词权重条（动态分类优先，base 也要显示） ----------
  $('taxonomyBtn').addEventListener('click', async () => {
    try {
      if (!window.vault || typeof window.vault.taxonomyProfiles !== 'function') { toast('分类画像尚未就绪'); return; }
      const r = await window.vault.taxonomyProfiles();
      const profiles = Array.isArray(r && r.profiles) ? r.profiles : [];
      const div = modalShell('🧠 分类画像');
      const body = div.querySelector('.mbody');
      if (!profiles.length) {
        body.innerHTML = '<div style="text-align:center;padding:24px 0;color:var(--ink-3);font-size:13px">还没有分类数据</div>';
        return;
      }
      // 首次运行：画像快照未建立，本周复盘后才有对比基线（弱化提示行）
      const firstRunHtml = (r && r.firstRun) ? '<div class="tp-firstrun">画像快照尚未建立，本周复盘后开始对比成长</div>' : '';
      // 强度可能是 0-1 小数也可能是原始数值：0-1 显示为百分比，其余原样
      const fmtStrength = (s) => {
        if (typeof s !== 'number' || isNaN(s)) return (s == null ? '' : String(s));
        return s <= 1 ? Math.round(s * 100) + '%' : String(Math.round(s));
      };
      const dyn = profiles.filter(p => p && !p.isBase);
      const base = profiles.filter(p => p && p.isBase);
      const html = dyn.concat(base).map(p => {
        const terms = (Array.isArray(p.terms) ? p.terms : []).filter(t => t && t.term);
        const maxW = terms.reduce((m, t) => Math.max(m, Number(t.weight) || 0), 0.0001);
        const rows = terms.slice(0, 6).map(t => {
          const w = Number(t.weight) || 0;
          const pct = Math.max(3, Math.round(w / maxW * 100));
          const num = Number.isFinite(w) ? Math.round(w * 10) / 10 : w;
          const isNew = Array.isArray(p.newTerms) && p.newTerms.some(nt => String(nt) === String(t.term));
          return `<div class="tp-row"><span class="tp-term" title="${esc(t.term)}">${esc(t.term)}${isNew ? '<span class="tp-new">新增</span>' : ''}</span><span class="tp-track"><span class="tp-fill" style="width:${pct}%"></span></span><span class="tp-num">${num}</span></div>`;
        }).join('');
        const st = fmtStrength(p.strength);
        return `<div class="tp-panel">
          <div class="tp-head">
            <span class="tp-name">${esc(p.name || '未命名')}${p.isBase ? '<span class="badge gray">基础</span>' : '<span class="badge">动态</span>'}</span>
            <span class="tp-meta">${Number(p.count) || 0} 条${st ? ' · 强度 ' + esc(st) : ''}</span>
            <span class="tp-kwbtn" data-cat="${esc(p.name || '')}" title="编辑这个分类的关键词规则">⚙ 关键词</span>
          </div>
          <div class="kw-slot" data-slot="${esc(p.name || '')}"></div>
          ${rows || '<div class="tp-empty">还没有学习数据——改分类时它会开始学习</div>'}
        </div>`;
      }).join('');
      // 点击回流可视化：接口缺失 / 报错时整个区块隐藏，不影响画像主体
      body.innerHTML = firstRunHtml + html;
      // ── 关键词编辑器：⚙ 展开每个分类的自定义关键词（词 + 权重 chips，整组保存） ──
      bindKeywordEditors(body);
      let rfWrap = null;
      try {
        if (window.vault && typeof window.vault.feedbackStats === 'function') {
          const fs = await window.vault.feedbackStats();
          const total = Number(fs && fs.total) || 0;
          const byTarget = (fs && Array.isArray(fs.byTarget)) ? fs.byTarget : [];
          rfWrap = document.createElement('div');
          rfWrap.className = 'tp-panel';
          rfWrap.innerHTML = `
            <div class="tp-head"><span class="tp-name">🔁 点击回流</span></div>
            ${total > 0
              ? `<div class="rf-sum">近 30 天你点击了 <b style="color:#dff0e6">${total}</b> 次相似推荐——这些条目会排得更靠前</div>
                 ${byTarget.slice(0, 5).map((it, i) => `
                   <div class="tp-row rf-row"><span class="rf-rank">${i + 1}</span><span class="rf-title" title="${esc(it.title || '')}">${esc(String(it.title || '').slice(0, 40))}</span><span class="tp-num">× ${Number(it.clicks) || 0}</span></div>`).join('')}`
              : '<div class="tp-empty">还没有点击记录——多用详情页的『相似资料』，引擎会学你的口味</div>'}`;
          body.appendChild(rfWrap);
        }
      } catch (e2) { if (rfWrap) rfWrap.remove(); } // 静默降级：无统计不白屏
      try {
        if (window.vault.taxonomyUserRules) {
          const rules = await window.vault.taxonomyUserRules();
          const wrap = document.createElement('div');
          wrap.className = 'tp-panel';
          wrap.innerHTML = `<div class="tp-head"><span class="tp-name">纠错规则</span></div>` +
            ((rules && rules.length) ? rules.map(r => `<div class="tp-row" style="flex-wrap:wrap;gap:8px">
              <span class="tp-term">${esc(r.category)} ← ${esc((r.terms || []).join(' + '))}</span>
              <span class="view-toggle" data-redit="${r.id}">编辑</span><span class="view-toggle" data-ren="${r.id}">${r.enabled ? '停用' : '启用'}</span>
              <span class="view-toggle" data-rprev="${r.id}">预览影响</span>
              <span class="view-toggle" data-rundo="${r.id}">撤销</span>
            </div>`).join('') : '<div class="tp-empty">在资料上改分类时，可选「以后类似也这样归类」</div>');
          body.appendChild(wrap);
          wrap.querySelectorAll('[data-redit]').forEach(b=>b.onclick=async()=>{const r=rules.find(x=>x.id===b.dataset.redit);const f=await uiForm('修改纠错规则',[{key:'category',label:'分类',value:r.category},{key:'terms',label:'同时包含这些词（空格分隔）',value:r.terms.join(' ')}]);if(!f)return;const result=await window.vault.taxonomySetUserRule({id:r.id,patch:{category:f.category,terms:f.terms.split(/\s+/).filter(Boolean)}});toast(result.ok?'规则已更新':result.error);if(result.ok)Object.assign(r,result.rule);});
          wrap.querySelectorAll('[data-ren]').forEach(b => b.addEventListener('click', async () => {
            const r = rules.find(x => x.id === b.dataset.ren);
            await window.vault.taxonomySetUserRule({ id: r.id, patch: { enabled: !r.enabled, revoked:false } });
            r.enabled=!r.enabled; r.revoked=false;b.textContent=r.enabled?'停用':'启用';toast(r.enabled?'已启用':'已停用');
          }));
          wrap.querySelectorAll('[data-rundo]').forEach(b => b.addEventListener('click', async () => {
            await window.vault.taxonomySetUserRule({ id: b.dataset.rundo, patch: { revoked: true, enabled: false } });
            const r=rules.find(x=>x.id===b.dataset.rundo);r.revoked=true;r.enabled=false;b.closest('.tp-row').querySelector('[data-ren]').textContent='启用';toast('已停用规则，已改过的资料保留现状');
          }));
          wrap.querySelectorAll('[data-rprev]').forEach(b => b.addEventListener('click', async () => {
            const p = await window.vault.taxonomyPreviewApply({ id: b.dataset.rprev });
            const n = (p && p.hits && p.hits.length) || 0;
            if (!n) { toast('没有受影响的条目'); return; }
            const go = await uiChoose('将影响 ' + n + ' 条（未锁定分类的）', [
              { key: 'yes', label: '应用到这些条目', desc: p.hits.slice(0, 6).map(h => h.title).join('、') },
              { key: 'no', label: '先不改历史', desc: '规则只影响以后新内容' },
            ]);
            if (go === 'yes') {
              const r = await window.vault.taxonomyApplyRule({ id: b.dataset.rprev, ids:p.hits.map(h=>h.id) });
              toast('已调整 ' + ((r && r.moved) || 0) + ' 条');
              refresh();
            }
          }));
        }
      } catch {}
    } catch (e) { toast('分类画像加载失败，稍后再试'); }
  });

  // 历史批次描述（仅当 autoOrganize 响应自带 batch 字段时展示，不做额外查询）
  function describeBatch(b) {
    try {
      if (!b) return '';
      if (typeof b === 'string') return b;
      if (Array.isArray(b)) return b.length ? `共 ${b.length} 条记录` : '';
      if (typeof b === 'object') {
        const parts = [];
        if (b.id != null) parts.push('#' + String(b.id).slice(-6));
        if (b.count != null) parts.push(String(b.count) + ' 条');
        const at = b.at || b.time || b.created_at;
        if (at) { try { parts.push(new Date(at).toLocaleString('zh-CN')); } catch (e) {} }
        return parts.join(' · ');
      }
      return String(b);
    } catch (e) { return ''; }
  }

  $('organizeBtn').addEventListener('click', async () => {
    try {
      if (!window.vault || typeof window.vault.autoOrganize !== 'function') { toast('整理功能尚未就绪'); return; }
      const scan = await window.vault.autoOrganize({ dryRun: true });
      const moved = Number(scan && scan.moved) || 0;
      if (!moved) { toast('积压区很干净，无需整理'); return; }
      const details = Array.isArray(scan.details) ? scan.details : [];
      const preview = details.slice(0, 4).map(d =>
        `• 「${String(d.title || '').slice(0, 18)}」${esc(d.from || '')} → ${esc(d.to || '')}`).join('\n');
      const more = details.length > 4 ? `\n…等共 ${details.length} 条` : '';
      const ok = await uiChoose(`确认整理？扫描 ${Number(scan.scanned) || 0} 条 · 可移动 ${moved} 条`,
        [{ key: 'go', label: '开始整理', desc: preview + more }]);
      if (!ok) return;
      const res = await window.vault.autoOrganize({ dryRun: false });
      const n = Number(res && res.moved) || 0;
      if (!n) { toast('积压区很干净，无需整理'); return; }
      screenSwap(() => refresh());
      if (res.undoable) {
        // 可撤销整理：小结果卡（含前 3 条去向 + 撤销按钮）替代一次性 toast
        const details = Array.isArray(res.details) ? res.details : [];
        const lines = details.slice(0, 3).map(d =>
          `• 「${String(d.title || '').slice(0, 16)}」${esc(d.from || '')} → ${esc(d.to || '')}`).join('\n');
        const more = details.length > 3 ? `\n…等共 ${details.length} 条` : '';
        const batchTxt = describeBatch(res.batch); // 响应里带历史 batch 才展示
        const div = modalShell('🧹 整理完成');
        div.querySelector('.mbody').innerHTML = `
          <div style="font-size:14px;font-weight:700;color:#dff0e6;margin-bottom:10px">已归位 ${n} 条</div>
          <div style="font-size:12px;color:var(--ink-2);line-height:1.9;white-space:pre-wrap">${lines || '（无明细）'}${more}</div>
          ${batchTxt ? `<div style="margin-top:10px;font-size:11px;color:var(--ink-3)">批次：${esc(batchTxt)}</div>` : ''}`;
        const btns = div.querySelector('.mbtns');
        btns.innerHTML = `<button class="btn-ghost" id="undoOrgBtn">↩ 撤销本次整理</button><button class="btn-ghost" data-x>关闭</button>`;
        btns.querySelector('[data-x]').addEventListener('click', () => div.remove());
        btns.querySelector('#undoOrgBtn').addEventListener('click', async () => {
          const b = btns.querySelector('#undoOrgBtn');
          b.disabled = true; b.textContent = '回滚中…';
          try {
            const u = await window.vault.undoOrganize();
            div.remove();
            if (u && u.ok) { toast(`已回滚 ${Number(u.restored) || 0} 条`); screenSwap(() => refresh()); }
            else toast((u && u.error) || '撤销失败');
          } catch (e2) { div.remove(); toast('撤销失败，稍后再试'); }
        });
      } else {
        toast(`已归位 ${n} 条`);
      }
    } catch (e) { toast('整理失败，稍后再试'); }
  });

          ${(Array.isArray(p.conflictSamples) && p.conflictSamples.length) ? `<div style="color:var(--ink-3)">冲突示例：${esc(p.conflictSamples.slice(0, 4).join('、'))}</div>` : ''}

            refresh(true);
          } else showPe('恢复失败：' + esc((r && r.error) || '未知错误'));
        } catch (e) { planDiv.remove(); showPe('恢复失败：' + esc(e.message)); }

    // ---- 旧版 JSON（只含记录与路径） ----

  function quoteCard(q, i) {
    return `
      <div class="qcard fx-item" style="--i:${Math.min(i, 14)}" data-id="${q.id}">
        <div class="qmark">❝</div>
        <div class="qtext">${esc(q.text)}</div>
        ${q.note ? `<div class="qnote"><b>我的理解</b> · ${esc(q.note)}</div>` : '<div class="qnote empty">＋ 写下你的理解</div>'}
        <div class="qmeta">
          ${q.source ? `<span class="qsrc ${q.source_item_id ? 'clickable-src' : ''}" title="${q.source_item_id ? '点击跳回原文' : esc(q.source)}">${esc(q.source.slice(0, 26))}${q.source.length > 26 ? '…' : ''}</span>` : ''}
          ${(q.tags || []).map(t => `<span class="chip">${esc(t)}</span>`).join('')}
          <span class="time" style="margin-left:auto">${fmtTime(q.created_at)}</span>
        </div>
      </div>`;

  function bindQuoteCards(scope) {
    scope.querySelectorAll('.qcard').forEach(card => card.addEventListener('click', (e) => {
      // 右上角 🔗 = 引用关联入口（弹选择另一条金句；点击冒泡被拦截）
      const linkBtn = e.target.closest('.qlink');
      if (linkBtn) {
        e.stopPropagation();
        pickQuoteLink(card.dataset.id);
        return;
      }
      // 点来源标签 → 跳回原文条目（金句 ↔ 原文双向）
      const srcEl = e.target.closest('.qsrc');
      const q = card.dataset.id;
      if (srcEl) {
        window.vault.listQuotes({}).then(list => {
          const found = list.find(x => x.id === q);
          if (found && found.source_item_id) {
            const iid = found.source_item_id;
            exitQuoteMode();
            state.category = ''; state.tag = ''; state.q = '';
            if ($('search')) $('search').value = '';
            screenSwap(() => refresh(true).then(() => {
              const target = $('list').querySelector(`[data-id="${iid}"]`);
              if (target) { target.click(); target.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
              else toast('原文条目已被删除，但金句还在');
            }));
            return;
          } else if (found) { editQuote(found); }
        });
        return;
      }
      window.vault.listQuotes({}).then(list => {
        const found = list.find(x => x.id === q);
        if (found) editQuote(found);
      });
    }));
  }

  // 金句卡片 🔗：选择另一条金句建立/取消引用关联（幂等由后台处理，成功后刷新视图）
  async function pickQuoteLink(fromId) {
    try {
      if (!window.vault || typeof window.vault.quoteLink !== 'function') { toast('关联功能尚未就绪'); return; }
      const quotes = (await window.vault.listQuotes({})).filter(x => x.id !== fromId);
      if (!quotes.length) { toast('还没有其他金句可关联'); return; }
      const pick = await uiChoose('关联到哪条金句？', quotes.map(x => ({
        key: x.id,
        label: (x.text || '').slice(0, 34) + ((x.text || '').length > 34 ? '…' : ''),
        desc: x.note ? (x.note || '').slice(0, 30) : '再次选择同一对可取消关联',
      })));
      if (!pick) return;
      await window.vault.quoteLink(fromId, pick);
      toast('已建立引用关联（再点一次可取消）');
      renderQuoteView();
    } catch (e) { toast('关联失败，稍后再试'); }
  }

  // 引用图谱：力导向布局（库仑斥力 + 连线弹簧 + 中心引力，RAF 每帧迭代；
  // alpha 能量衰减 + 4 秒上限自动停机，不常驻耗电；节点可拖拽，释放后物理继续）
  async function showQuoteGraph() {
    try {
      if (!window.vault || typeof window.vault.quoteGraph !== 'function') { toast('图谱功能尚未就绪'); return; }
      const g = await window.vault.quoteGraph();
      const nodes = (g && Array.isArray(g.nodes)) ? g.nodes : [];
      const edges = (g && Array.isArray(g.edges)) ? g.edges : [];
      const div = modalShell('🔗 引用图谱');
      const body = div.querySelector('.mbody');
      if (!nodes.length || !edges.length) {
        body.innerHTML = `<div style="text-align:center;padding:30px 10px;color:var(--ink-3);font-size:13px;line-height:2">🔗 还没有引用关系<br>在金句卡片上点 <b style="color:#ecd9c4">🔗</b> 关联其他金句，建立你的知识网络</div>`;
        return;
      }
      const W = 460, H = 400, CX = W / 2, CY = H / 2;
      const R = Math.min(W, H) / 2 - 64;
      // 初始位置：圆周布点 + 微扰动（打破对称，让力导向自然展开）
      const nodeList = nodes.map((n, i) => {
        const ang = (i / nodes.length) * Math.PI * 2 - Math.PI / 2;
        const firstTag = Array.isArray(n.tags) ? n.tags.map(x => String(x || '').trim()).filter(Boolean)[0] : null;
        return {
          id: n.id, text: n.text || '', tag: firstTag || null, // 首个标签：着色 / 同标签聚类用
          x: CX + R * Math.cos(ang) + (Math.random() - .5) * 14,
          y: CY + R * Math.sin(ang) + (Math.random() - .5) * 14,
          vx: 0, vy: 0, el: null,
        };
      });
      const nodeMap = new Map(nodeList.map(nd => [nd.id, nd]));
      const edgeList = [];
      edges.forEach(ed => {
        const a = nodeMap.get(ed.a), b = nodeMap.get(ed.b);
        if (a && b && a !== b) edgeList.push({ a, b });
      });
      // ---- 标签着色：标签字符串 hash → 稳定色相（同一标签永远同色，固定饱和度/亮度保证暗底可读） ----
      const tagHue = new Map();
      for (const nd of nodeList) {
        if (nd.tag && !tagHue.has(nd.tag)) {
          let h = 0;
          for (let i = 0; i < nd.tag.length; i++) h = (h * 31 + nd.tag.charCodeAt(i)) | 0;
          tagHue.set(nd.tag, ((h % 360) + 360) % 360);
        }
      }
      const nodeFill = (nd) => nd.tag ? `hsl(${tagHue.get(nd.tag)},62%,64%)` : '#8a938c'; // 无标签：中性灰
      // ---- 图例：最多 8 个标签（按出现次数） + 「未标签」灰点；标签超过 8 个时末尾 +N ----
      const tagCount = new Map();
      for (const nd of nodeList) { if (nd.tag) tagCount.set(nd.tag, (tagCount.get(nd.tag) || 0) + 1); }
      const sortedTags = [...tagCount.entries()].sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1));
      const LEGEND_MAX = 8;
      // 图例项可点击：data-tag 空字符串 = 「未标签」；「+N」溢出项不可筛选
      const legendHtml = sortedTags.slice(0, LEGEND_MAX).map(([tg]) =>
        `<span class="qg-lg-item clickable" data-tag="${esc(tg)}" title="点击只看该标签，再点恢复全部"><span class="qg-lg-dot" style="background:hsl(${tagHue.get(tg)},62%,64%)"></span><span class="qg-lg-name">${esc(tg)}</span></span>`
      ).join('')
        + (nodeList.some(nd => !nd.tag) ? `<span class="qg-lg-item clickable" data-tag="" title="点击只看未标签，再点恢复全部"><span class="qg-lg-dot" style="background:#8a938c"></span><span class="qg-lg-name">未标签</span></span>` : '')
        + (sortedTags.length > LEGEND_MAX ? `<span class="qg-lg-item"><span class="qg-lg-name">+${sortedTags.length - LEGEND_MAX}</span></span>` : '');
      body.innerHTML = `
        <div class="qg-legend">${legendHtml}</div>
        <svg class="qg-svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"></svg>
        <div style="text-align:center;font-size:11px;color:var(--ink-3);margin-top:8px">${nodes.length} 个金句 · ${edges.length} 条引用关系 · 点击节点查看关联 · 可拖拽节点调整布局</div>`;
      const svg = body.querySelector('svg');
      const NS = 'http://www.w3.org/2000/svg';
      // 连线层在下、节点层在上；全部 DOM API 构建（textContent 天然防注入）
      const lineEls = edgeList.map(ed => {
        const l = document.createElementNS(NS, 'line');
        l.setAttribute('class', 'qg-edge');
        l.dataset.a = ed.a.id; l.dataset.b = ed.b.id;
        svg.appendChild(l);
        return l;
      });
      for (const nd of nodeList) {
        const grp = document.createElementNS(NS, 'g');
        grp.setAttribute('class', 'qg-node');
        grp.dataset.id = nd.id;
        const ti = document.createElementNS(NS, 'title');
        ti.textContent = (nd.tag ? `#${nd.tag}\n` : '') + nd.text; // hover：#标签 + 金句全文
        const c = document.createElementNS(NS, 'circle');
        c.setAttribute('r', '6');
        c.setAttribute('fill', nodeFill(nd)); // 标签着色；hover/lit/drag 仍由 CSS 规则接管，保持原行为
        const t = document.createElementNS(NS, 'text');
        t.setAttribute('text-anchor', 'middle');
        t.setAttribute('transform', `translate(0,${nd.y > CY ? 20 : -12})`);
        t.textContent = String(nd.text).slice(0, 8);
        grp.appendChild(ti); grp.appendChild(c); grp.appendChild(t);
        svg.appendChild(grp);
        nd.el = grp;
      }
      // ---- 图例标签筛选：点某标签只显示该标签节点及其连线，再点同一标签恢复全部 ----
      let activeFilter = null; // null = 全部可见；'' = 未标签；'xxx' = 某标签
      const legendEl = body.querySelector('.qg-legend');
      legendEl.addEventListener('click', (e) => {
        const item = e.target.closest('.qg-lg-item.clickable');
        if (!item) return;
        const tg = item.dataset.tag;
        // 再点同一标签（或筛选态下点别处标签先清旧再加新）→ 同标签即恢复全部
        if (activeFilter === tg) {
          activeFilter = null;
          item.classList.remove('sel');
          nodeList.forEach(nd => nd.el.style.display = '');
          lineEls.forEach(l => l.style.display = '');
          svg.querySelectorAll('.qg-node.lit, .qg-node.dimmed, .qg-edge.lit, .qg-edge.dimmed')
            .forEach(x => x.classList.remove('lit', 'dimmed'));
          return;
        }
        activeFilter = tg;
        legendEl.querySelectorAll('.qg-lg-item.sel').forEach(x => x.classList.remove('sel'));
        item.classList.add('sel');
        const match = (nd) => (tg === '') ? !nd.tag : nd.tag === tg;
        const visibleIds = new Set();
        nodeList.forEach(nd => {
          const show = match(nd);                       // 隐藏用 display:none，物理模拟继续跑
          nd.el.style.display = show ? '' : 'none';
          if (show) visibleIds.add(nd.id);
        });
        lineEls.forEach((l, i) => {
          const show = visibleIds.has(edgeList[i].a.id) && visibleIds.has(edgeList[i].b.id);
          l.style.display = show ? '' : 'none';
        });
        // 清掉残留的点击高亮，避免隐藏节点上留着 lit/dimmed 状态
        svg.querySelectorAll('.qg-node.lit, .qg-node.dimmed, .qg-edge.lit, .qg-edge.dimmed')
          .forEach(x => x.classList.remove('lit', 'dimmed'));
        wake(); // 重新注入能量，让可见子图自然松弛重新聚拢
      });
      // ---- 物理模拟（节点 < 200，O(n²) 斥力每帧约 2 万次内） ----
      const REP = 2600, SPRING = 0.055, REST = 92, GRAV = 0.02, DAMP = 0.86, VMAX = 14;
      let alpha = 1, rafId = 0, t0 = performance.now();
      let dragging = null, dragMoved = 0, lastMouse = null;
      const alive = () => document.body.contains(div);
      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
      function tick() {
        if (!alive()) { stopLoop(); return; }          // 弹窗已关：停 RAF
        if (performance.now() - t0 > 4000) alpha = Math.min(alpha, 0.012); // 4 秒上限
        if (alpha < 0.012) { rafId = 0; return; }     // 能量耗尽：自动停机
        for (let i = 0; i < nodeList.length; i++) {
          const A = nodeList[i];
          for (let j = i + 1; j < nodeList.length; j++) {
            const B = nodeList[j];
            let dx = B.x - A.x, dy = B.y - A.y;
            let d2 = dx * dx + dy * dy;
            if (d2 < 1) { d2 = 1; dx = Math.random() - .5; dy = Math.random() - .5; }
            const d = Math.sqrt(d2);
            const f = (REP * alpha) / d2;
            const fx = dx / d * f, fy = dy / d * f;
            A.vx -= fx; A.vy -= fy; B.vx += fx; B.vy += fy;
            // 同标签轻微聚合力：独立弱弹簧（更短静息距、更小劲度），随 alpha 衰减，不动既有参数
            if (A.tag && A.tag === B.tag) {
              const f2 = (d - 60) * 0.03 * alpha;
              A.vx += dx / d * f2; A.vy += dy / d * f2;
              B.vx -= dx / d * f2; B.vy -= dy / d * f2;
            }
          }
        }
        for (const ed of edgeList) {
          const dx = ed.b.x - ed.a.x, dy = ed.b.y - ed.a.y;
          const d = Math.max(1, Math.sqrt(dx * dx + dy * dy));
          const f = (d - REST) * SPRING * alpha;
          const fx = dx / d * f, fy = dy / d * f;
          ed.a.vx += fx; ed.a.vy += fy; ed.b.vx -= fx; ed.b.vy -= fy;
        }
        for (const nd of nodeList) {
          nd.vx = clamp((nd.vx + (CX - nd.x) * GRAV) * DAMP, -VMAX, VMAX);
          nd.vy = clamp((nd.vy + (CY - nd.y) * GRAV) * DAMP, -VMAX, VMAX);
          if (nd === dragging) continue; // 拖拽中的节点位置由鼠标接管
          nd.x = clamp(nd.x + nd.vx, 14, W - 14);
          nd.y = clamp(nd.y + nd.vy, 14, H - 14);
        }
        redraw();
        alpha *= 0.985;
        rafId = requestAnimationFrame(tick);
      }
      function redraw() { // 连线随节点实时更新
        for (const nd of nodeList) nd.el.setAttribute('transform', `translate(${nd.x.toFixed(1)},${nd.y.toFixed(1)})`);
        for (let i = 0; i < edgeList.length; i++) {
          const ed = edgeList[i];
          lineEls[i].setAttribute('x1', ed.a.x.toFixed(1));
          lineEls[i].setAttribute('y1', ed.a.y.toFixed(1));
          lineEls[i].setAttribute('x2', ed.b.x.toFixed(1));
          lineEls[i].setAttribute('y2', ed.b.y.toFixed(1));
        }
      }
      function wake() { // 交互后重新注入能量继续模拟（会再次衰减停机）
        if (alpha < 0.012) alpha = 0.45;
        t0 = performance.now();
        if (!rafId) rafId = requestAnimationFrame(tick);
      }
      function stopLoop() { if (rafId) { cancelAnimationFrame(rafId); rafId = 0; } }
      // ---- 拖拽：mousedown 抓取 → mousemove 跟随 → 释放后物理继续 ----
      function svgPoint(e) {
        const r = svg.getBoundingClientRect();
        return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
      }
      function onDown(e) {
        const g = e.target.closest ? e.target.closest('.qg-node') : null;
        if (!g) return;
        e.preventDefault();
        dragging = nodeMap.get(g.dataset.id) || null;
        if (!dragging) return;
        dragMoved = 0; lastMouse = svgPoint(e);
        dragging.el.classList.add('drag');
        wake();
      }
      function onMove(e) {
        if (!dragging) return;
        if (!alive()) { cleanup(); return; } // 弹窗已关：顺手摘掉 window 级监听
        const p = svgPoint(e);
        dragMoved += Math.abs(p.x - lastMouse.x) + Math.abs(p.y - lastMouse.y);
        lastMouse = p;
        dragging.x = clamp(p.x, 14, W - 14);
        dragging.y = clamp(p.y, 14, H - 14);
        redraw();
      }
      function onUp() {
        if (!dragging) return;
        dragging.el.classList.remove('drag');
        dragging = null;
        wake(); // 释放后物理继续，邻居被推开再回落
      }
      function cleanup() {
        stopLoop();
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
      }
      svg.addEventListener('mousedown', onDown);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
      // 点击节点高亮其连线与对端（拖拽超过阈值不当作点击，保持原行为）
      svg.addEventListener('click', (e) => {
        if (dragMoved > 5) { dragMoved = 0; return; }
        const node = e.target.closest('.qg-node');
        svg.querySelectorAll('.qg-node.lit, .qg-node.dimmed, .qg-edge.lit, .qg-edge.dimmed')
          .forEach(x => x.classList.remove('lit', 'dimmed'));
        if (!node) return;
        const id = node.dataset.id;
        svg.querySelectorAll('.qg-edge').forEach(l => {
          if (l.dataset.a === id || l.dataset.b === id) {
            l.classList.add('lit');
            svg.querySelectorAll('.qg-node').forEach(nd => {
              if (nd.dataset.id === l.dataset.a || nd.dataset.id === l.dataset.b) nd.classList.add('lit');
              else nd.classList.add('dimmed');
            });
          }
        });
        if (!svg.querySelector('.qg-edge.lit')) {
          svg.querySelectorAll('.qg-node').forEach(nd => { if (nd.dataset.id === id) nd.classList.add('lit'); });
        }
      });
      redraw();
      wake(); // 启动模拟（能量衰减 + 4s 上限保证自动停机）
    } catch (e) { toast('图谱加载失败，稍后再试'); }
  }

  async function showDailyQuote() {
    const q = await window.vault.randomQuote();
    const box = $('qDailyBox');
    if (!q) { toast('金句库还是空的'); return; }
    box.innerHTML = `
      <div class="daily-quote fx-in">
        <div class="dq-label">每日一句 · 提醒你回看</div>
        <div class="dq-text">${esc(q.text)}</div>
        ${q.note ? `<div class="dq-note">${esc(q.note)}</div>` : ''}
        ${q.source ? `<div class="dq-src">— ${esc(q.source)}</div>` : ''}
      </div>`;
    box.scrollIntoView({ block: 'nearest' });
  }

  async function editQuote(existing) {
    // 优先取当前划选文字
    let sel = '';
    try { sel = String(window.getSelection().toString() || '').trim(); } catch {}
    const fields = [
      { key: 'text', label: '金句内容', value: existing ? existing.text : sel, ph: '那句话本身…', ta: true },
      { key: 'note', label: '我的理解（为什么打动你 / 它说明什么）', value: existing ? existing.note : '', ph: '写下你的思考，这是金句和摘抄的区别', ta: true },
      { key: 'source', label: '来源（资料标题 / 谁 / 哪里）', value: existing ? (existing.source || '') : (currentId && items.find(x => x.id === currentId) ? items.find(x => x.id === currentId).title : ''), ph: '如：某本书第二章 / 张三的微信' },
      { key: 'tags', label: '标签（空格分隔）', value: existing ? (existing.tags || []).join(' ') : '', ph: '如：认知 决策' },
    ];
    const r = await uiForm(existing ? '编辑金句' : '收录金句', fields.map(f => ({ ...f, value: f.value || '' })));
    if (!r) return;
    if (!r.text.trim()) { toast('金句内容不能为空'); return; }
    const payload = {
      text: r.text.trim(), note: r.note.trim(), source: r.source.trim(),
      tags: r.tags.trim() ? r.tags.trim().split(/\s+/).slice(0, 6) : [],
    };
    if (existing) { await window.vault.updateQuote(existing.id, payload); toast('已更新'); }
    else {
      if (!payload.source && currentId) { const it2 = items.find(x => x.id === currentId); if (it2) payload.source = it2.title; payload.source_item_id = currentId; }
      await window.vault.addQuote(payload); toast('❝ 已收进金句库');
    }
    renderQuoteView();
  }

  async function runReview(mode) {
    const TITLES = { daily: '正在生成今日复盘…', cycle: '正在生成知识积累复盘…', weekly: '正在生成本周复盘…', monthly: '正在生成本月复盘…' };
    const mask = loadingMask(TITLES[mode] || '正在生成复盘…');
    const r = await window.vault.reviewGenerate({ mode });
    mask.remove();
    if (!r.ok) { toast(r.error || '生成失败'); return; }
    showReviewModal(r);
  }

  async function showReviewHistory() {
    const list = await window.vault.reviewsList();
    const div = modalShell('历史复盘');
    const body = div.querySelector('.mbody');
    if (!list.length) {
      body.innerHTML = '<div style="color:var(--ink-3);font-size:13px;text-align:center;padding:24px 0">还没有复盘记录。<br>每晚 21:30 会自动生成（当天有录入时），也可手动生成。</div>';
      return;
    }
    const MODE_BADGES = { daily: ['每日', ''], cycle: ['3天', 'blue'], weekly: ['每周', 'gray'], monthly: ['每月', 'burl'] };
    body.innerHTML = list.map(r => `
      <div class="rev-item" data-file="${esc(r.file || '')}">
        <div class="rt">${revTypeBadge(r, MODE_BADGES)}${esc(r.label)}复盘 · ${r.source === 'ai' ? 'AI 生成' : '统计版'} · ${r.item_count} 条</div>
        <div class="rm">${new Date(r.created_at).toLocaleString('zh-CN')}</div>
      </div>`).join('');
    body.querySelectorAll('.rev-item').forEach(el => el.addEventListener('click', () => {
      const r = list.find(x => x.file === el.dataset.file) || list[0];
      div.remove();
      showReviewModal({ ...r, ok: true });
    }));
  }

  // 历史复盘按文件名前缀映射类型徽标（daily-每日 / cycle-3天 / weekly-每周 / monthly-每月）
  function revTypeBadge(r, MODE_BADGES) {
    const file = String(r.file || '');
    let kind = r.mode || null;
    if (!kind || !MODE_BADGES[kind]) {
      const prefix = file.split('-')[0];
      kind = MODE_BADGES[prefix] ? prefix : null;
    }
    const entry = kind && MODE_BADGES[kind] ? MODE_BADGES[kind] : null;
    if (!entry) return '';
    return `<span class="badge ${entry[1]}">${entry[0]}</span>`;
  }

  function showReviewModal(r) {
    const div = modalShell(`${r.label}学习复盘`);
    const reviewParts=[];renderHeadedParts(r.text||'',reviewParts);
    div.querySelector('.mbody').innerHTML=reviewParts.join('');
    div.querySelector('.mbody').style.whiteSpace='normal';
    const btns = div.querySelector('.mbtns');
    btns.innerHTML = '<button class="btn-ghost" id="closeRev">关闭</button><button class="btn-ghost" id="copyRev">复制</button>';
    div.querySelector('#closeRev').onclick=()=>div.remove();
    div.querySelector('#copyRev').addEventListener('click', () => { navigator.clipboard.writeText(r.text); toast('已复制'); });
  }

  // ---------- 通用弹窗组件 ----------
  function modalShell(title) {
    $('toast').classList.remove('show');
    const div = document.createElement('div');
    div.className = 'mask';
    div.innerHTML = `<div class="modal">
      <h3>${esc(title)}</h3>
      <div class="mbody"></div>
      <div class="mbtns"><button class="btn-ghost" data-x>关闭</button></div>
    </div>`;
    document.body.appendChild(div);
    div.querySelector('[data-x]').addEventListener('click', () => div.remove());
    div.addEventListener('click', (e) => { if (e.target === div) div.remove(); });
    return div;
  }
  function loadingMask(msg) {
    const div = document.createElement('div');
    div.className = 'mask';
    div.innerHTML = `<div class="modal" style="text-align:center;padding:36px 22px">
      <div style="font-size:14px;color:#f2f5f1">${esc(msg)}</div>
      <div style="margin-top:10px;font-size:11.5px;color:var(--ink-3)">未配置 API 时为即时统计版</div>
    </div>`;
    document.body.appendChild(div);
    return div;
  }
  function uiForm(title, fields, hint, options = {}) {
    return new Promise((resolve) => {
      const div = document.createElement('div');
      div.className = 'mask';
      div.innerHTML = `<div class="modal"><h3>${esc(title)}</h3>
        ${hint ? `<div class="mhint">${esc(hint)}</div>` : ''}
        ${fields.map(f => f.type === 'select' ? `<div class="frow"><label>${esc(f.label)}</label><select data-k="${f.key}">${f.options.map(o=>`<option value="${esc(o.key)}">${esc(o.label)}</option>`).join('')}</select></div>` : f.type === 'textarea'
          ? `<div class="frow"><label>${esc(f.label)}</label><textarea data-k="${f.key}" rows="6" placeholder="${esc(f.ph || '')}">${esc(f.value || '')}</textarea></div>`
          : `<div class="frow"><label>${esc(f.label)}</label><input type="${['datetime-local','password'].includes(f.type)?f.type:'text'}" autocomplete="${f.type==='password'?'new-password':'off'}" aria-label="${esc(f.label)}" data-k="${f.key}" value="${esc(f.value || '')}" placeholder="${esc(f.ph || '')}"></div>${f.key===options.actionAfterKey?`<div class="frow"><button class="btn-ghost" data-form-action>${esc(options.actionLabel)}</button><div class="mhint" data-action-result role="status" aria-live="polite" style="margin-top:8px"></div></div>`:''}`).join('')}
        <div class="mbtns"><button class="btn-ghost" data-c>取消</button><button class="btn3d" data-s>保存</button></div>
      </div>`;
      document.body.appendChild(div);
      const values = () => Object.fromEntries([...div.querySelectorAll('[data-k]')].map(i=>[i.dataset.k,i.value]));
      const action = div.querySelector('[data-form-action]');
      if (action && options.onAction) {
        const result=div.querySelector('[data-action-result]');let revision=0;
        div.addEventListener('input',()=>{revision++;if(result.textContent)result.textContent='配置已修改，请重新测试连接';});
        action.onclick=async()=>{const started=revision;action.disabled=true;result.textContent='正在测试连接…';try{const message=await options.onAction(values());if(started===revision)result.textContent=message;}catch{if(started===revision)result.textContent='测试未完成，请检查配置后重试';}finally{action.disabled=false;}};
      }
      div.querySelector('[data-c]').addEventListener('click', () => { div.remove(); resolve(null); });
      div.addEventListener('click', (e) => { if (e.target === div) { div.remove(); resolve(null); } });
      div.querySelector('[data-s]').addEventListener('click', () => {
        const out = {};
        div.querySelectorAll('[data-k]').forEach(i => out[i.dataset.k] = i.value);
        div.remove(); resolve(out);
      });
    });
  }
  function uiChoose(title, options) {
    return new Promise((resolve) => {
      const div = document.createElement('div');
      div.className = 'mask';
      div.innerHTML = `<div class="modal"><h3>${esc(title)}</h3><div class="mbody">
        ${options.map(o => `<div class="rev-item" data-k="${o.key}"><div class="rt">${esc(o.label)}</div><div class="rm">${esc(o.desc || '')}</div></div>`).join('')}
      </div><div class="mbtns"><button class="btn-ghost" data-c>取消</button></div></div>`;
      document.body.appendChild(div);
      div.querySelector('[data-c]').addEventListener('click', () => { div.remove(); resolve(null); });
      div.addEventListener('click', (e) => {
        if (e.target === div) { div.remove(); resolve(null); return; }
        const it = e.target.closest('.rev-item');
        if (it) { div.remove(); resolve(it.dataset.k); }
      });
    });
  }
  let toastT;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => t.classList.remove('show'), 2600);
  }
  // 带动作的 toast：动作先行、反悔在后 —— 破坏性操作不再用 confirm 阻断（苹果式撤销）
  function toastAction(msg, label, fn, ms = 5000) {
    const t = $('toast');
    t.innerHTML = '';
    t.append(document.createTextNode(msg + '　'));
    const btn = document.createElement('span');
    btn.className = 'toast-act';
    btn.textContent = label;
    btn.addEventListener('click', () => { try { fn(); } catch {} t.classList.remove('show'); clearTimeout(toastT); });
    t.appendChild(btn);
    t.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => t.classList.remove('show'), ms);
  }

  // 键盘流：↑↓ 导航 · ⏎ 打开原文 · ⌘F 搜索 · ⌘1-5 视图 · ? 速查卡（输入框内不拦截）
  document.addEventListener('keydown', (e) => {
    const typing = e.target && (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName) || e.target.isContentEditable);
    // ⌘F 聚焦搜索（输入框里也放行——浏览器肌肉记忆）
    if ((e.metaKey || e.ctrlKey) && (e.key === 'f' || e.key === 'F')) {
      e.preventDefault();
      const s = $('search');
      if (s) { s.focus(); s.select(); }
      return;
    }
    if (typing) return;
    if (e.key === 'Escape' && multiMode) { setMultiMode(false); return; } // Esc 退出多选
    // ⌘1-6 视图直达
    if ((e.metaKey || e.ctrlKey) && ['1', '2', '3', '4', '5', '6'].includes(e.key)) {
      e.preventDefault();
      const views = ['all', 'favorites', 'today', 'week', 'quotes', 'reuse'];
      const v = views[Number(e.key) - 1];
      const nav = document.querySelector(`.nav[data-view="${v}"]`);
      if (nav && !quoteMode) nav.click();
      return;
    }
    // ? 速查卡
    if (e.key === '?' || (e.shiftKey && e.key === '/')) { e.preventDefault(); showCheatSheet(); return; }
    if (!items.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const idx = items.findIndex(i => i.id === currentId);
      const next = e.key === 'ArrowDown' ? Math.min(items.length - 1, idx + 1) : Math.max(0, idx <= 0 ? 0 : idx - 1);
      currentId = items[next].id;
      renderList(false); renderDetail();
      const el = document.querySelector('.card.active');
      if (el) el.scrollIntoView({ block: 'nearest' });
      return;
    }
    // ⏎ 打开当前条目的"原文"：链接→浏览器 · 文件/文件包→Finder · 视频→系统播放器
    if (e.key === 'Enter' && currentId && !quoteMode && !reuseMode) {
      const it = items.find(i => i.id === currentId);
      if (!it) return;
      if (it.url) window.vault.openExternal(it.url);
      else if (it.kind === 'video' && it.source_path && window.vault.openFile) window.vault.openFile(it.source_path);
      else if (it.files && it.files.length) window.vault.reveal(it.files[0].path);
      else if (it.source_path) window.vault.reveal(it.source_path);
      return;
    }
  });

  // 快捷键速查卡（? 呼出）
  function showCheatSheet() {
    const rows = [
      ['⌘⇧L', '快速收录（任何应用里）'],
      ['⌘⇧R', '记忆复习 · 今日卡片'],
      ['⌘F', '聚焦搜索（命中词高亮）'],
      ['↑ ↓', '在列表中移动选择'],
      ['⏎', '打开选中条目的原文（链接/文件/视频）'],
      ['⌘1~5', '视图：全部 · 星标 · 今日 · 本周 · 金句'],
      ['⌘6', '继续使用工作台'],
      ['Esc', '关闭弹窗 / 退出多选'],
      ['?', '本速查卡'],
    ];
    const div = modalShell('⌨ 快捷键');
    div.querySelector('.mbody').innerHTML = rows.map(([k, d]) =>
      `<div style="display:flex;gap:14px;align-items:center;padding:6px 2px;border-bottom:1px solid rgba(255,255,255,.06)">
        <kbd style="min-width:64px;text-align:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-bottom-width:2px;border-radius:5px;padding:2px 8px;font-size:11px;font-family:inherit">${esc(k)}</kbd>
        <span style="font-size:12.5px;color:var(--ink-2)">${esc(d)}</span></div>`).join('');
  }

  function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
  function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  // ---- 主窗拖拽直收：视频/图片只建索引不复制，文档归档，链接直收 ----
  // 计数法防嵌套元素闪烁；仅当拖的是文件或链接时才亮遮罩（页面内文字拖动不触发）
  const dzMask = $('dropmask');
  let dzDepth = 0;
  const dzHasPayload = (dt) => {
    if (!dt || !dt.types) return false;
    const ts = dt.types.includes ? dt.types : [...dt.types];
    return ts.includes('Files') || ts.includes('text/uri-list');
  };
  document.addEventListener('dragenter', (e) => {
    if (!dzHasPayload(e.dataTransfer)) return;
    e.preventDefault();
    if (++dzDepth === 1) dzMask.classList.add('show');
  });
  document.addEventListener('dragover', (e) => {
    if (!dzHasPayload(e.dataTransfer)) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'copy';
  });
  document.addEventListener('dragleave', () => {
    if (dzDepth > 0 && --dzDepth === 0) dzMask.classList.remove('show');
  });
  window.addEventListener('dragend', () => { dzDepth = 0; dzMask.classList.remove('show'); });
  document.addEventListener('drop', async (e) => {
    if (dzDepth === 0) return; // 非文件/链接拖放的内部 drop，交给默认行为
    e.preventDefault();
    dzDepth = 0; dzMask.classList.remove('show');
    const dt = e.dataTransfer;
    const filePaths = dt.files && dt.files.length
      ? [...dt.files].map(f => window.vault.pathForFile ? window.vault.pathForFile(f) : '').filter(Boolean)
      : [];
    const uri = (dt.getData('text/uri-list') || '').split('\n')[0].trim();
    if (filePaths.length) {
      toast('⏳ 收录中…');
      try { await window.vault.ingest({ kind: 'file', filePaths, notes: '' }); } catch {}
    } else if (/^https?:\/\//i.test(uri)) {
      toast('⏳ 收录中…');
      try { await window.vault.ingest({ kind: 'url', url: uri, notes: '' }); } catch {}
    }
  });

  window.vault.onIngestDone((d) => {
    if (d && d.recla) return;
    toast('✓ 已入库：' + (d ? d.title.slice(0, 30) : '') + (d && d.category ? ' → ' + d.category : ''));
  });
  window.vault.onItemFocus(async p=>{currentId=p.id;pendingHighlight=p.messageIds?.[0]||null;await renderDetail();});
  // 通知可达（P0）：主进程发来的导航事件（晚间小结/回看通知点击 → 直达视图）
  if (window.vault.onNavigate) window.vault.onNavigate(async (p) => {
    if (p && p.view) setView(p.view);
    if (p && p.itemId) { try { const it = await window.vault.get(p.itemId); if (it && !it.trashed) { currentId = p.itemId; renderDetail(); } } catch {} }
  });
  window.vault.onLibraryChanged(() => {
    if (reuseMode) { renderReuseView(); return; } // C 轮：继续使用视图下库变化就地理刷新工作台
    refresh(true); if (currentId && !$('et')) renderDetail();
  });
  bindMilestone(); // 里程碑推送：toast + 脉冲 + 积累条刷新（内部已容错）
  bindStreakBar(); // 积累条点击 → 直达成就墙
  bindAchvDetails(); // 成就卡点击 → 详情弹窗
  refresh(false, true);
</script>
